<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esoteric Winter Crickets</title>
  <script>if (/#(invite|recovery|confirmation)_token=/.test(location.hash)) location.replace('/admin/' + location.hash);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
      --text-main: #f0ece1;
      --text-muted: #9e978e;
    }

    /* Dynamic Realm Accent Variables on Body */
    body[data-realm="cosmos"] {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
    }
    body[data-realm="verdant"] {
      --gold-accent: #00f5d4;
      --hub-glow-primary: rgba(0, 245, 212, 0.4);
      --hub-glow-secondary: rgba(56, 176, 0, 0.3);
    }
    body[data-realm="ember"] {
      --gold-accent: #ff9f1c;
      --hub-glow-primary: rgba(255, 159, 28, 0.4);
      --hub-glow-secondary: rgba(224, 30, 55, 0.3);
    }
    body[data-realm="abyss"] {
      --gold-accent: #00bbf9;
      --hub-glow-primary: rgba(0, 187, 249, 0.4);
      --hub-glow-secondary: rgba(0, 245, 212, 0.25);
    }
    body[data-realm="astral"] {
      --gold-accent: #e2eafc;
      --hub-glow-primary: rgba(226, 234, 252, 0.4);
      --hub-glow-secondary: rgba(163, 177, 204, 0.25);
    }
    body[data-realm="nyc"] {
      --gold-accent: #ffbe0b;
      --hub-glow-primary: rgba(255, 190, 11, 0.45);
      --hub-glow-secondary: rgba(0, 240, 255, 0.3);
    }
    body[data-realm="wilderness"] {
      --gold-accent: #a8e6cf;
      --hub-glow-primary: rgba(168, 230, 207, 0.4);
      --hub-glow-secondary: rgba(100, 181, 246, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #050508;
      color: var(--text-main);
      font-family: 'Cinzel', serif;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Cross-Fading Realm Backdrop Layers */
    #realm-backdrops {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .realm-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .realm-layer.active {
      opacity: 1;
    }

    /* 1. Cosmos (Obsidian & Violet) */
    .realm-cosmos {
      background: radial-gradient(circle at center, #0d0b18 0%, #050508 75%, #000000 100%);
    }
    .realm-cosmos::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 15% 25%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1.5px 1.5px at 35% 65%, rgba(255, 209, 102, 0.5), transparent),
        radial-gradient(1px 1px at 55% 15%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(2px 2px at 75% 45%, rgba(179, 102, 255, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 25% 85%, rgba(255, 77, 121, 0.45), transparent);
      background-size: 350px 350px;
      opacity: 0.65;
    }

    /* 2. Verdant (Bioluminescent Canopy) */
    .realm-verdant {
      background: 
        radial-gradient(circle at 50% 50%, rgba(11, 59, 46, 0.85) 0%, rgba(4, 22, 18, 0.95) 65%, #020907 100%);
    }
    .realm-verdant::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(0, 245, 212, 0.75), transparent),
        radial-gradient(2.5px 2.5px at 65% 25%, rgba(128, 237, 153, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 40% 75%, rgba(0, 245, 212, 0.55), transparent),
        radial-gradient(3px 3px at 80% 70%, rgba(87, 204, 153, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, rgba(199, 249, 204, 0.6), transparent);
      background-size: 320px 320px;
      opacity: 0.75;
    }

    /* 3. Ember (Alchemical Red Ochre & Copper) */
    .realm-ember {
      background: 
        radial-gradient(circle at 50% 50%, rgba(46, 15, 10, 0.9) 0%, rgba(20, 6, 4, 0.96) 70%, #080201 100%);
    }
    .realm-ember::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 25% 20%, rgba(255, 159, 28, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 35%, rgba(255, 90, 54, 0.7), transparent),
        radial-gradient(2.5px 2.5px at 45% 80%, rgba(212, 175, 55, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, rgba(255, 183, 3, 0.6), transparent),
        radial-gradient(2px 2px at 15% 60%, rgba(230, 57, 70, 0.55), transparent);
      background-size: 340px 340px;
      opacity: 0.75;
    }

    /* 4. Abyss (Abyssal Sapphire Trench) */
    .realm-abyss {
      background: 
        radial-gradient(circle at 50% 50%, rgba(7, 29, 64, 0.9) 0%, rgba(3, 11, 28, 0.96) 70%, #01040a 100%);
    }
    .realm-abyss::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 30% 25%, rgba(0, 240, 255, 0.75), transparent),
        radial-gradient(1.5px 1.5px at 60% 55%, rgba(0, 187, 249, 0.65), transparent),
        radial-gradient(2.5px 2.5px at 20% 70%, rgba(72, 202, 228, 0.55), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(202, 240, 248, 0.7), transparent);
      background-size: 360px 360px;
      opacity: 0.7;
    }

    /* 5. Astral (Silver Aether & Eclipse) */
    .realm-astral {
      background: 
        radial-gradient(circle at 50% 50%, rgba(26, 28, 40, 0.9) 0%, rgba(10, 11, 16, 0.96) 70%, #030305 100%);
    }
    .realm-astral::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 18% 22%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2px 2px at 52% 68%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1px 1px at 78% 18%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.5px 1.5px at 35% 82%, rgba(182, 204, 254, 0.65), transparent);
      background-size: 300px 300px;
      opacity: 0.8;
    }

    /* 6. NYC (New York City Nocturne Skyline & River Reflections) */
    .realm-nyc {
      background: linear-gradient(
        180deg,
        #03060e 0%,
        #091326 42%,
        #162440 70%,
        #2b2238 86%,
        #070a12 100%
      );
    }
    .realm-nyc::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 48% 12%, rgba(255, 209, 102, 0.55), transparent),
        radial-gradient(1px 1px at 82% 22%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.5px 1.5px at 28% 32%, rgba(0, 240, 255, 0.45), transparent),
        radial-gradient(60% 28% at 50% 82%, rgba(255, 170, 50, 0.18), transparent);
      background-size: 400px 400px, 400px 400px, 400px 400px, 400px 400px, 100% 100%;
    }

    .nyc-skyline-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36vh;
      min-height: 240px;
      max-height: 380px;
      display: block;
    }

    .nyc-beacon {
      animation: beaconPulse 2.8s ease-in-out infinite alternate;
    }

    @keyframes beaconPulse {
      0% { opacity: 0.35; r: 2; }
      100% { opacity: 1; r: 3.6; }
    }

    /* 7. Wilderness (Nocturnal Forest Canopy, Stars & Luminous Moon) */
    .realm-wilderness {
      background: linear-gradient(
        180deg,
        #02040a 0%,
        #06101e 40%,
        #0b1d2c 72%,
        #071418 90%,
        #020608 100%
      );
    }
    .realm-wilderness::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.2px 1.2px at 14% 16%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.8px 1.8px at 32% 10%, rgba(168, 230, 207, 0.75), transparent),
        radial-gradient(1px 1px at 64% 18%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(2px 2px at 84% 12%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1.4px 1.4px at 48% 28%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 22% 40%, rgba(168, 230, 207, 0.55), transparent);
      background-size: 380px 380px;
      opacity: 0.85;
    }

    .wilderness-scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .wilderness-star-twinkle {
      animation: starPulse 3.6s ease-in-out infinite alternate;
    }

    @keyframes starPulse {
      0% { opacity: 0.35; }
      100% { opacity: 1; }
    }

    /* Top Title Banner */
    header {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 25;
      pointer-events: none;
      width: 90vw;
    }

    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 2.2vw, 2.1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 18px var(--hub-glow-primary), 0 0 35px var(--hub-glow-secondary);
      transition: text-shadow 1s ease;
    }

    header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #active-slice-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 14px;
      border-radius: 14px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-accent);
      border: 1px solid var(--gold-accent);
      background: rgba(8, 8, 16, 0.75);
      box-shadow: 0 0 14px var(--hub-glow-primary);
      transition: all 0.8s ease;
    }

    /* 3D Interactive Cosmic Viewport */
    #cosmos-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      z-index: 5;
      perspective: 1400px;
    }

    #network-stage {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 1000px;
      height: 1000px;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      transform-style: preserve-3d;
    }

    /* Critical Fix: Ensure #disks-container fills the 1000x1000 stage instead of collapsing to 0x0 */
    #disks-container {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1000px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* 3D Disk Planes */
    .disk-plane {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1000px;
      transform-style: preserve-3d;
      transition: 
        transform 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.15s ease;
      pointer-events: none;
    }

    .disk-plane.active-disk {
      transform: translate3d(0, 0, 0) rotateX(0deg) scale(1);
      opacity: 1;
      filter: blur(0px);
      pointer-events: auto;
      z-index: 8;
    }

    .disk-plane.inactive-disk-above {
      transform: translate3d(0, -210px, -520px) rotateX(68deg) rotateZ(-18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    .disk-plane.inactive-disk-below {
      transform: translate3d(0, 210px, -520px) rotateX(68deg) rotateZ(18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    /* Faint Outer Halo Ring for 3D Disks */
    .disk-halo-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 680px;
      height: 680px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 40px var(--hub-glow-primary);
      pointer-events: none;
    }

    /* SVG Connecting Ligaments Layer */
    .ligaments-svg {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 1000px;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    .ligament-path {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 6;
      animation: pulseFlow 14s linear infinite;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.82;
    }

    .ligament-vine-main {
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.9;
    }

    .ligament-vine-tendril {
      fill: none;
      stroke-width: 1.4;
      stroke-dasharray: 4 3;
      stroke-linecap: round;
      animation: pulseFlow 18s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.7;
    }

    /* Suspension Bridge Filament Styles */
    .ligament-suspension-cable {
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.92;
    }

    .ligament-suspension-deck {
      fill: none;
      stroke-width: 1.8;
      stroke-dasharray: 7 5;
      stroke-linecap: round;
      animation: pulseFlow 12s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.85;
    }

    .ligament-suspension-struts {
      fill: none;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.55;
    }

    /* NYC Electric Grid & Subway Conduit Filament Styles */
    .ligament-grid-rail {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.85;
    }

    .ligament-grid-subrail {
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      opacity: 0.45;
    }

    .ligament-grid-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: bevel;
      stroke-dasharray: 18 150;
      animation: electricSurge 3.2s linear infinite;
      filter: drop-shadow(0 0 8px currentColor);
      opacity: 0.95;
    }

    .ligament-grid-station {
      fill: #050811;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 5px currentColor);
    }

    /* Gothic Wrought-Iron & Thorny Lancet Filament Styles */
    .ligament-gothic-spine {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.92;
    }

    .ligament-gothic-tracery {
      fill: none;
      stroke-width: 1.25;
      stroke-dasharray: 10 4 2 4;
      stroke-linecap: round;
      animation: pulseFlow 16s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.78;
    }

    .ligament-gothic-thorns {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 4px currentColor);
      opacity: 0.88;
    }

    .ligament-gothic-finial {
      fill: #050508;
      stroke-width: 1.6;
      filter: drop-shadow(0 0 6px currentColor);
    }

    /* Connecting Path Illumination for Focused/Hovered Portrait Portals */
    .portal-filament-group {
      transition: filter 0.28s ease, opacity 0.28s ease;
    }

    .portal-filament-group.is-illuminated path,
    .portal-filament-group.is-illuminated circle,
    .portal-filament-group.is-illuminated polygon {
      opacity: 1;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
    }

    @keyframes electricSurge {
      to { stroke-dashoffset: -336; }
    }

    /* Slender Alchemical Astrolabe Conduit Styles */
    .bridge-filament-group {
      cursor: pointer;
      pointer-events: auto;
    }

    /* Invisible 16px hit-target so the skinny line is still easy to click/hover */
    .bridge-hit-target {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      stroke-linecap: round;
    }

    .bridge-outer-aura {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.16;
      filter: blur(1.5px);
      transition: opacity 0.35s ease, stroke-width 0.35s ease;
    }

    .bridge-core-path {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 1.15;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px var(--gold-accent));
      opacity: 0.92;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .bridge-astrolabe-arc {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 0.65;
      stroke-dasharray: 5 4;
      stroke-linecap: round;
      opacity: 0.52;
      animation: bridgePulse 14s linear infinite;
      transition: opacity 0.35s ease;
    }

    .bridge-astrolabe-ticks {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 0.75;
      stroke-linecap: round;
      opacity: 0.58;
      transition: opacity 0.35s ease;
    }

    .bridge-warp-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-dasharray: 14 280;
      animation: warpSurge 3.6s linear infinite;
      filter: drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 8px var(--gold-accent));
    }

    .bridge-harmonic-node {
      fill: #050508;
      stroke: var(--gold-accent);
      stroke-width: 1.1;
      filter: drop-shadow(0 0 5px var(--gold-accent));
      transition: transform 0.35s ease, stroke 0.35s ease;
    }

    .bridge-filament-group:hover .bridge-outer-aura {
      opacity: 0.38;
      stroke-width: 3.5;
    }

    .bridge-filament-group:hover .bridge-core-path {
      stroke: #ffffff;
      stroke-width: 1.4;
    }

    .bridge-filament-group:hover .bridge-astrolabe-arc,
    .bridge-filament-group:hover .bridge-astrolabe-ticks {
      opacity: 0.9;
    }

    @keyframes bridgePulse {
      to { stroke-dashoffset: -180; }
    }

    @keyframes warpSurge {
      to { stroke-dashoffset: -588; }
    }

    /* Outlying Alchemical Armillary & Ouroboros Portal Node */
    .bridge-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 18;
      pointer-events: auto;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bridge-node:hover {
      transform: translate(-50%, calc(-50% - 3px)) scale(1.06);
    }

    .bridge-sigil-ring {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26, 18, 44, 0.92) 0%, rgba(5, 4, 10, 0.98) 78%);
      border: 1.25px solid rgba(212, 175, 55, 0.78);
      box-shadow:
        0 0 18px var(--hub-glow-primary),
        inset 0 0 14px rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .bridge-sigil-ring::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 0.85px solid rgba(212, 175, 55, 0.38);
      opacity: 0.8;
      pointer-events: none;
      transition: border-color 0.35s ease, opacity 0.35s ease;
    }

    .bridge-sigil-ring::after {
      content: "";
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 0.75px dashed rgba(255, 255, 255, 0.28);
      opacity: 0.5;
      animation: slowSpin 42s linear infinite;
      pointer-events: none;
    }

    .bridge-node:hover .bridge-sigil-ring {
      border-color: #ffffff;
      box-shadow:
        0 0 26px var(--gold-accent),
        0 0 48px var(--hub-glow-primary),
        inset 0 0 20px rgba(212, 175, 55, 0.45);
    }

    .bridge-node:hover .bridge-sigil-ring::before {
      border-color: var(--gold-accent);
      opacity: 1;
    }

    .bridge-sigil-svg {
      width: 74px;
      height: 74px;
      color: var(--gold-accent);
      overflow: visible;
    }

    .armillary-ouroboros {
      transform-origin: 32px 32px;
      animation: slowSpinReverse 38s linear infinite;
    }

    .armillary-rings {
      transform-origin: 32px 32px;
      animation: slowSpin 26s linear infinite;
    }

    .armillary-keyhole {
      transform-origin: 32px 32px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.35s ease;
    }

    .bridge-node:hover .armillary-keyhole {
      transform: scaleX(1.22) scaleY(1.1);
      filter: drop-shadow(0 0 6px #ffffff);
    }

    /* Floating Engraved Label (Matches Janice & Paul Floating Script Style) */
    .bridge-label {
      margin-top: 10px;
      text-align: center;
      background: transparent;
      padding: 0 6px;
      border: none;
      box-shadow: none;
    }

    .bridge-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-accent);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 12px var(--hub-glow-primary);
      white-space: nowrap;
    }

    .bridge-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.84rem;
      color: var(--text-main);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    @keyframes pulseFlow {
      to { stroke-dashoffset: -140; }
    }

    /* Central Sacred Geometry Hub */
    .center-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      border-radius: 50%;
      z-index: 14;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(22, 16, 40, 0.95) 0%, rgba(7, 5, 14, 0.98) 75%);
      box-shadow: 
        0 0 35px var(--hub-glow-primary),
        0 0 70px var(--hub-glow-secondary),
        inset 0 0 25px var(--hub-glow-primary);
      border: 1.5px solid var(--gold-accent);
      transition: box-shadow 1s ease, border-color 1s ease;
    }

    .hub-geometry {
      width: 146px;
      height: 146px;
      animation: slowSpin 50s linear infinite;
    }

    /* Orbiting Winter Crickets */
    .cricket-orbit {
      position: absolute;
      width: 232px;
      height: 232px;
      border-radius: 50%;
      border: 1px dashed rgba(212, 175, 55, 0.3);
      animation: slowSpinReverse 65s linear infinite;
      pointer-events: none;
    }

    .cricket-icon {
      position: absolute;
      width: 42px;
      height: 42px;
      color: var(--gold-accent);
      filter: drop-shadow(0 0 6px var(--gold-accent));
      overflow: visible;
      transition: color 1s ease, filter 1s ease;
    }

    .cricket-icon.top {
      top: -21px;
      left: calc(50% - 21px);
      transform: rotate(-90deg);
    }
    .cricket-icon.bottom {
      bottom: -21px;
      left: calc(50% - 21px);
      transform: rotate(90deg);
    }
    .cricket-icon.left {
      left: -21px;
      top: calc(50% - 21px);
      transform: rotate(180deg);
    }
    .cricket-icon.right {
      right: -21px;
      top: calc(50% - 21px);
      transform: rotate(0deg);
    }

    /* Cricket Leg & Antenna Articulation Animations */
    .cricket-leg,
    .cricket-antenna,
    .cricket-body {
      transform-box: view-box;
    }

    .leg-fl { transform-origin: 28px 21px; }
    .leg-fr { transform-origin: 36px 21px; }
    .leg-ml { transform-origin: 27px 28px; }
    .leg-mr { transform-origin: 37px 28px; }
    .leg-hl { transform-origin: 28px 35px; }
    .leg-hr { transform-origin: 36px 35px; }
    .ant-l  { transform-origin: 29px 15px; }
    .ant-r  { transform-origin: 35px 15px; }
    .cricket-body { transform-origin: 32px 32px; }

    .gait-a.leg-fl,
    .gait-a.leg-hl {
      animation: swingLeftLeg 0.55s ease-in-out infinite alternate;
    }
    .gait-a.leg-mr {
      animation: swingRightLeg 0.55s ease-in-out infinite alternate;
    }

    .gait-b.leg-fr,
    .gait-b.leg-hr {
      animation: swingRightLeg 0.55s ease-in-out infinite alternate-reverse;
    }
    .gait-b.leg-ml {
      animation: swingLeftLeg 0.55s ease-in-out infinite alternate-reverse;
    }

    .ant-l {
      animation: feelerLeft 1.1s ease-in-out infinite alternate;
    }
    .ant-r {
      animation: feelerRight 1.3s ease-in-out infinite alternate;
    }

    .cricket-body {
      animation: bodySway 0.55s ease-in-out infinite alternate;
    }

    @keyframes swingLeftLeg {
      0%   { transform: rotate(-13deg) translateY(1px); }
      100% { transform: rotate(15deg) translateY(-1px); }
    }

    @keyframes swingRightLeg {
      0%   { transform: rotate(-15deg) translateY(-1px); }
      100% { transform: rotate(13deg) translateY(1px); }
    }

    @keyframes feelerLeft {
      0%   { transform: rotate(-9deg); }
      100% { transform: rotate(11deg); }
    }

    @keyframes feelerRight {
      0%   { transform: rotate(9deg); }
      100% { transform: rotate(-11deg); }
    }

    @keyframes bodySway {
      0%   { transform: rotate(-2.2deg) translateY(-0.6px); }
      100% { transform: rotate(2.2deg) translateY(0.6px); }
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slowSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Portal Branch Nodes */
    .portal-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 12;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .portal-node:hover {
      transform: translate(-50%, -50%) scale(1.12);
      z-index: 15;
    }

    .portal-ring {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      padding: 5px;
      background: radial-gradient(circle, rgba(15, 15, 25, 0.9), rgba(5, 5, 10, 0.98));
      border: 2px solid var(--node-border, #d4af37);
      box-shadow: 
        0 0 22px var(--node-glow, rgba(212, 175, 55, 0.5)),
        inset 0 0 14px var(--node-glow, rgba(212, 175, 55, 0.4));
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
      overflow: hidden;
    }

    /* Multi-Layer Glowing Aura on Hover */
    .portal-node:hover .portal-ring {
      border-color: var(--text-main);
      box-shadow: 
        0 0 30px var(--node-glow),
        0 0 60px var(--node-glow),
        0 0 90px var(--node-glow),
        inset 0 0 22px var(--node-glow);
    }

    .portal-ring::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px dashed var(--node-border);
      opacity: 0.65;
      animation: slowSpin 28s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .portal-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      transition: transform 0.5s ease;
    }

    .portal-node:hover .portal-thumb {
      transform: scale(1.08);
    }

    .portal-label {
      margin-top: 10px;
      text-align: center;
      background: rgba(6, 5, 12, 0.78);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.65);
    }

    .portal-title {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-main);
      text-shadow: 0 0 10px var(--node-glow);
      white-space: nowrap;
    }

    .portal-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* The opening disc's two personal doorways (Janice & Paul) */
    button.introduction-node {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 10px 18px 14px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.28s ease;
    }

    /* Preserve Violet for Janice and Gold for Paul */
    .introduction-node[data-person="introduction-janice"] {
      --intro-accent: #c58cff;
      --intro-inner-ring: rgba(226, 196, 255, 0.88);
      --intro-outer-ring: rgba(186, 122, 255, 0.48);
      --intro-outer-faint: rgba(217, 179, 255, 0.32);
      --intro-glow-rest: rgba(179, 102, 255, 0.28);
      --intro-glow-active: rgba(197, 140, 255, 0.54);
    }

    .introduction-node[data-person="introduction-paul"] {
      --intro-accent: #e6c35c;
      --intro-inner-ring: rgba(255, 232, 168, 0.88);
      --intro-outer-ring: rgba(212, 175, 55, 0.5);
      --intro-outer-faint: rgba(255, 225, 140, 0.32);
      --intro-glow-rest: rgba(212, 175, 55, 0.26);
      --intro-glow-active: rgba(255, 209, 102, 0.52);
    }

    /* Portrait Frame: Crisp Inner Ring + Delicate Outer Ring + Soft Surrounding Glow */
    .introduction-node .portal-ring {
      width: 190px;
      height: 190px;
      padding: 7px;
      border: 1.5px solid var(--intro-inner-ring);
      background: radial-gradient(circle at 45% 35%, rgba(34, 25, 48, 0.92), #07050e 78%);
      box-shadow:
        0 0 26px var(--intro-glow-rest),
        0 0 54px rgba(5, 4, 13, 0.55),
        inset 0 0 18px var(--intro-glow-rest);
      overflow: visible;
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.28s ease,
        box-shadow 0.28s ease;
    }

    /* Delicate Ornamental Outer Ring */
    .introduction-node .portal-ring::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 1px solid var(--intro-outer-ring);
      box-shadow: 0 0 12px var(--intro-glow-rest);
      opacity: 0.82;
      animation: none;
      pointer-events: none;
      transition:
        border-color 0.28s ease,
        opacity 0.28s ease,
        box-shadow 0.28s ease;
    }

    /* Restrained Celestial Filigree Whisper Ring */
    .introduction-node .portal-ring::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px dashed var(--intro-outer-faint);
      opacity: 0.55;
      pointer-events: none;
      transition:
        border-color 0.28s ease,
        opacity 0.28s ease;
    }

    .introduction-node .portal-thumb {
      border-radius: 50%;
      clip-path: circle(50%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16);
      transition: filter 0.28s ease;
    }

    .introduction-node[data-person="introduction-janice"] .portal-thumb {
      object-fit: contain;
      background: #020104;
    }

    .introduction-node[data-person="introduction-paul"] .portal-thumb {
      object-fit: cover;
      object-position: 46% 50%;
    }

    /* Subtle 3px Portrait Lift & Frame Illumination on Hover, Focus, or Touch */
    .introduction-node:hover,
    .introduction-node:focus-visible,
    .introduction-node.is-touch-active {
      transform: translate(-50%, -50%);
      z-index: 16;
    }

    .introduction-node:hover .portal-ring,
    .introduction-node:focus-visible .portal-ring,
    .introduction-node:active .portal-ring,
    .introduction-node.is-touch-active .portal-ring {
      transform: translateY(-3px);
      border-color: #fffdf7;
      box-shadow:
        0 0 30px var(--intro-glow-active),
        0 0 58px var(--intro-glow-rest),
        inset 0 0 22px var(--intro-glow-rest);
    }

    .introduction-node:hover .portal-ring::before,
    .introduction-node:focus-visible .portal-ring::before,
    .introduction-node:active .portal-ring::before,
    .introduction-node.is-touch-active .portal-ring::before {
      border-color: var(--intro-inner-ring);
      opacity: 1;
      box-shadow: 0 0 16px var(--intro-glow-active);
    }

    .introduction-node:hover .portal-ring::after,
    .introduction-node:focus-visible .portal-ring::after,
    .introduction-node:active .portal-ring::after,
    .introduction-node.is-touch-active .portal-ring::after {
      border-color: var(--intro-outer-ring);
      opacity: 0.85;
    }

    .introduction-node:hover .portal-thumb,
    .introduction-node:focus-visible .portal-thumb,
    .introduction-node:active .portal-thumb,
    .introduction-node.is-touch-active .portal-thumb {
      transform: none;
      filter: brightness(1.05);
    }

    .introduction-sigil {
      display: block;
      width: 100%;
      height: 100%;
      color: var(--node-border);
      filter: drop-shadow(0 0 9px var(--node-glow));
    }

    .introduction-sigil text {
      fill: currentColor;
      font-family: 'Cinzel Decorative', serif;
      font-size: 35px;
      text-anchor: middle;
    }

    /* Floating Expressive Script Nameplate & Curved Underline Flourish */
    .introduction-node .portal-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 14px;
      padding: 2px 10px 0;
      min-width: 0;
      background: transparent;
      backdrop-filter: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .introduction-node .portal-title {
      font-family: 'Pinyon Script', 'Cormorant Garamond', cursive;
      font-size: 3.15rem;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0.01em;
      text-transform: none;
      color: var(--text-main);
      -webkit-text-stroke: 0.2px currentColor;
      text-shadow:
        0 2px 10px rgba(3, 2, 8, 0.96),
        0 0 18px rgba(3, 2, 8, 0.9),
        0 0 14px var(--intro-glow-rest);
      transition: color 0.28s ease, text-shadow 0.28s ease;
    }

    .introduction-node[data-person="introduction-paul"] .portal-title {
      font-family: 'Herr Von Muellerhoff', 'Cormorant Garamond', cursive;
      font-size: 3.35rem;
    }

    .introduction-node:hover .portal-title,
    .introduction-node:focus-visible .portal-title,
    .introduction-node:active .portal-title,
    .introduction-node.is-touch-active .portal-title {
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(3, 2, 8, 0.98),
        0 0 20px var(--intro-glow-active),
        0 0 30px var(--intro-glow-rest);
    }

    .introduction-flourish {
      display: block;
      width: 142px;
      height: 18px;
      margin-top: -2px;
      color: var(--intro-accent);
      opacity: 0.76;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 6px var(--intro-glow-rest));
      transition: opacity 0.28s ease, filter 0.28s ease;
      overflow: visible;
      pointer-events: none;
    }

    .introduction-node:hover .introduction-flourish,
    .introduction-node:focus-visible .introduction-flourish,
    .introduction-node:active .introduction-flourish,
    .introduction-node.is-touch-active .introduction-flourish {
      opacity: 1;
      filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 10px var(--intro-glow-active));
    }

    .introduction-node:focus-visible {
      outline: 1.5px solid var(--intro-inner-ring);
      outline-offset: 8px;
      border-radius: 32px;
    }

    /* Color Themes */
    .theme-nocturnal {
      --node-color: #b366ff;
      --node-glow: rgba(179, 102, 255, 0.6);
      --node-border: #d9b3ff;
    }

    .theme-cyber {
      --node-color: #00f0ff;
      --node-glow: rgba(0, 240, 255, 0.6);
      --node-border: #99f9ff;
    }

    .theme-celestial {
      --node-color: #ffd166;
      --node-glow: rgba(255, 209, 102, 0.6);
      --node-border: #ffe8a3;
    }

    .theme-oceanic {
      --node-color: #00f5d4;
      --node-glow: rgba(0, 245, 212, 0.6);
      --node-border: #9bfbee;
    }

    .theme-rose {
      --node-color: #ff4d79;
      --node-glow: rgba(255, 77, 121, 0.65);
      --node-border: #ffb3c6;
    }

    /* Gallery Modal Overlay */
    #gallery-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 6, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    #gallery-modal.active {
      display: flex;
    }

    .modal-content-box {
      width: min(94vw, 1150px);
      height: 85vh;
      max-height: 85vh;
      background: rgba(10, 8, 18, 0.96);
      backdrop-filter: blur(16px);
      color: var(--text-main);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(179, 102, 255, 0.22);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 16px;
      margin-bottom: 22px;
    }

    .modal-title-group h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }

    .modal-title-group p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .close-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      font-family: 'Cinzel', serif;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.25s ease;
    }

    .close-btn:hover {
      border-color: var(--gold-accent);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* A poem emerges inside the same portal overlay as the archives. */
    #gallery-modal.poem-mode .modal-content-box {
      width: min(94vw, 780px);
      height: 86vh;
      height: 86svh;
      max-height: 860px;
      border-color: var(--poem-border, var(--gold-accent));
      background: radial-gradient(ellipse at 50% 0%, var(--poem-glow, rgba(179, 102, 255, 0.15)), transparent 65%), rgba(10, 8, 18, 0.98);
      box-shadow: 0 0 65px rgba(0, 0, 0, 0.85), 0 0 35px var(--poem-glow);
      transition: border-color 0.65s ease, box-shadow 0.65s ease;
    }

    /* Brief Selection Accent Carry-Over into Poetry Panel Opening */
    #gallery-modal.poem-mode[data-selection-accent="violet"] .modal-content-box {
      border-color: rgba(217, 179, 255, 0.85);
      box-shadow:
        0 0 65px rgba(0, 0, 0, 0.88),
        0 0 44px rgba(179, 102, 255, 0.46),
        inset 0 0 24px rgba(179, 102, 255, 0.16);
    }

    #gallery-modal.poem-mode[data-selection-accent="gold"] .modal-content-box {
      border-color: rgba(255, 232, 163, 0.88);
      box-shadow:
        0 0 65px rgba(0, 0, 0, 0.88),
        0 0 44px rgba(212, 175, 55, 0.46),
        inset 0 0 24px rgba(212, 175, 55, 0.16);
    }

    #modal-poem-panel[hidden] { display: none; }

    #modal-poem-panel {
      overflow-y: auto;
      overscroll-behavior: contain;
      user-select: text;
      padding: 6px clamp(4px, 4vw, 32px) 36px;
      scrollbar-color: var(--poem-border) transparent;
    }

    .poem-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 400;
      color: var(--poem-border, var(--text-main));
      letter-spacing: 0.08em;
      margin: 0 0 24px;
    }

    .poem-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 2.2vw, 1.65rem);
      line-height: 1.65;
      color: var(--text-main);
    }

    .poem-text.emerging {
      animation: poemEmerge 950ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .poem-empty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 32px;
    }

    @keyframes poemEmerge {
      from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem-text.emerging,
      .ligament-path,
      .ligament-vine-tendril,
      .ligament-suspension-deck,
      .ligament-grid-surge,
      .ligament-gothic-tracery,
      .bridge-astrolabe-arc,
      .bridge-warp-surge {
        animation: none !important;
      }
      button.introduction-node,
      .introduction-node .portal-ring,
      .introduction-node:hover .portal-ring,
      .introduction-node:focus-visible .portal-ring,
      .introduction-node:active .portal-ring,
      .introduction-node.is-touch-active .portal-ring {
        transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        transform: none !important;
      }
    }

    /* Decorative poem realms remain behind the selectable verse. */
    #gallery-modal.poem-mode .modal-content-box {
      position: relative;
      isolation: isolate;
    }
    #gallery-modal.poem-mode .modal-title-group { display: none; }
    #gallery-modal.poem-mode .modal-header {
      position: relative;
      z-index: 1;
      justify-content: flex-end;
      border-bottom: 0;
      padding-bottom: 0;
      margin-bottom: 12px;
    }
    #gallery-modal.poem-mode #modal-poem-panel,
    #gallery-modal.poem-mode #lock-screen { position: relative; z-index: 1; }
    #gallery-modal.poem-mode #modal-poem-panel {
      min-height: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, transparent, rgba(3, 8, 12, 0.4) 12%, rgba(3, 8, 12, 0.4) 88%, transparent);
      text-shadow: 0 1px 3px #020606;
    }
    #gallery-modal.poem-mode[data-poem-theme="natural"] .modal-content-box {
      background: radial-gradient(ellipse at 0% 15%, rgba(79, 130, 83, 0.22), transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(68, 114, 88, 0.22), transparent 55%), #07110e;
    }
    #gallery-modal.poem-mode[data-poem-theme="cosmic"] .modal-content-box {
      background: radial-gradient(ellipse at 100% 10%, rgba(90, 76, 166, 0.28), transparent 55%),
        radial-gradient(ellipse at 0% 95%, rgba(38, 102, 132, 0.23), transparent 55%), #080c1c;
    }
    .poem-ornament {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #gallery-modal.poem-mode[data-poem-theme="natural"] .poem-ornament-natural,
    #gallery-modal.poem-mode[data-poem-theme="cosmic"] .poem-ornament-cosmic { display: block; }
    .poem-vine-glow { filter: drop-shadow(0 0 4px rgba(149, 207, 155, 0.26)); }
    .poem-cosmic-glow { filter: drop-shadow(0 0 5px rgba(146, 176, 244, 0.3)); }

    /* Password Lock Screen View */
    #lock-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 16px;
    }

    #lock-screen.active {
      display: flex;
    }

    #lock-screen p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--gold-accent);
      letter-spacing: 0.08em;
    }

    .lock-input {
      background: rgba(5, 5, 10, 0.9);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      text-align: center;
      width: min(320px, 80vw);
      outline: none;
      letter-spacing: 0.15em;
    }

    .lock-input:focus {
      border-color: var(--gold-accent);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .unlock-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      font-family: 'Cinzel', serif;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.25s ease;
    }

    .unlock-btn:hover {
      background: var(--gold-accent);
      color: #000;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }

    .lock-error {
      color: #ff4d79;
      font-size: 0.85rem;
      font-style: italic;
      height: 20px;
    }

    /* Bulletproof Non-Overlapping Grid Container with Explicit Row Height */
    .photo-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 220px;
      align-content: start;
      gap: 18px;
      overflow-y: auto;
      padding-right: 6px;
      height: 100%;
      min-height: 0;
    }

    .photo-grid.active {
      display: grid;
    }

    .photo-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: radial-gradient(circle, #141124 0%, #08070f 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      height: 220px;
      cursor: zoom-in;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 18px rgba(212, 175, 55, 0.3);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .photo-card img.loaded {
      opacity: 1;
    }

    /* Fullscreen Lightbox Overlay */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 5, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
      padding: 24px;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    /* Discreet Sanctum Sigil Link to /admin/ */
    .sanctum-sigil-link {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      z-index: 50;
      color: var(--gold-accent);
      opacity: 0.14;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 
        opacity 0.4s ease,
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.4s ease,
        color 1s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sanctum-sigil-link:hover,
    .sanctum-sigil-link:focus-visible {
      opacity: 0.95;
      transform: scale(1.18) rotate(45deg);
      filter: drop-shadow(0 0 8px var(--gold-accent)) drop-shadow(0 0 18px var(--hub-glow-primary));
    }

    .sanctum-sigil-link svg {
      width: 28px;
      height: 28px;
    }

    /* Responsive Scaling for Tablet & Mobile Viewports */
    @media (max-width: 1024px) {
      #network-stage {
        transform: translate(-50%, -50%) scale(0.76);
      }
    }

    @media (max-width: 768px) {
      #cosmos-viewport {
        perspective: none;
      }
      #network-stage,
      #disks-container,
      .disk-plane {
        transform-style: flat;
      }
      .disk-plane.inactive-disk-above,
      .disk-plane.inactive-disk-below {
        display: none;
      }
      #network-stage {
        transform: translate(-50%, -50%) scale(0.56);
      }
      .portal-ring {
        width: 96px;
        height: 96px;
      }
      .introduction-node .portal-ring {
        width: 190px;
        height: 190px;
      }
      body.landing-disc-active #network-stage {
        transform: translate(-50%, -50%) scale(0.5);
      }
    }

    @media (max-width: 600px) {
      #network-stage,
      body.landing-disc-active #network-stage {
        transform: translate(-50%, -50%) scale(0.42);
      }
      #gallery-modal.poem-mode { padding: 12px; }
      #gallery-modal.poem-mode .modal-content-box { padding: 22px 18px; }
      #gallery-modal.poem-mode .modal-title-group h2 { font-size: 1.25rem; }
      #gallery-modal.poem-mode .close-btn { padding: 8px 10px; font-size: 0.72rem; }
    }

    @media (max-width: 380px) {
      #network-stage,
      body.landing-disc-active #network-stage {
        transform: translate(-50%, -50%) scale(0.35);
      }
    }
  </style>
</head>
