<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esoteric Winter Crickets</title>
  <script>if (/#(invite|recovery|confirmation)_token=/.test(location.hash)) location.replace('/admin/' + location.hash);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
      --text-main: #f0ece1;
      --text-muted: #9e978e;
    }

    /* Dynamic Realm Accent Variables on Body */
    body[data-realm="cosmos"] {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
    }
    body[data-realm="verdant"] {
      --gold-accent: #00f5d4;
      --hub-glow-primary: rgba(0, 245, 212, 0.4);
      --hub-glow-secondary: rgba(56, 176, 0, 0.3);
    }
    body[data-realm="ember"] {
      --gold-accent: #ff9f1c;
      --hub-glow-primary: rgba(255, 159, 28, 0.4);
      --hub-glow-secondary: rgba(224, 30, 55, 0.3);
    }
    body[data-realm="abyss"] {
      --gold-accent: #00bbf9;
      --hub-glow-primary: rgba(0, 187, 249, 0.4);
      --hub-glow-secondary: rgba(0, 245, 212, 0.25);
    }
    body[data-realm="astral"] {
      --gold-accent: #e2eafc;
      --hub-glow-primary: rgba(226, 234, 252, 0.4);
      --hub-glow-secondary: rgba(163, 177, 204, 0.25);
    }
    body[data-realm="nyc"] {
      --gold-accent: #ffbe0b;
      --hub-glow-primary: rgba(255, 190, 11, 0.45);
      --hub-glow-secondary: rgba(0, 240, 255, 0.3);
    }
    body[data-realm="wilderness"] {
      --gold-accent: #a8e6cf;
      --hub-glow-primary: rgba(168, 230, 207, 0.4);
      --hub-glow-secondary: rgba(100, 181, 246, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      color: var(--text-main);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* Cross-Fading Realm Backdrop Layers */
    #realm-backdrops {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .realm-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .realm-layer.active {
      opacity: 1;
    }

    /* 1. Cosmos (Obsidian & Violet) */
    .realm-cosmos {
      background: radial-gradient(circle at center, #0d0b18 0%, #050508 75%, #000000 100%);
    }
    .realm-cosmos::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 15% 25%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1.5px 1.5px at 35% 65%, rgba(255, 209, 102, 0.5), transparent),
        radial-gradient(1px 1px at 55% 15%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(2px 2px at 75% 45%, rgba(179, 102, 255, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 25% 85%, rgba(255, 77, 121, 0.45), transparent);
      background-size: 350px 350px;
      opacity: 0.65;
    }

    /* 2. Verdant (Bioluminescent Canopy) */
    .realm-verdant {
      background: 
        radial-gradient(circle at 50% 50%, rgba(11, 59, 46, 0.85) 0%, rgba(4, 22, 18, 0.95) 65%, #020907 100%);
    }
    .realm-verdant::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(0, 245, 212, 0.75), transparent),
        radial-gradient(2.5px 2.5px at 65% 25%, rgba(128, 237, 153, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 40% 75%, rgba(0, 245, 212, 0.55), transparent),
        radial-gradient(3px 3px at 80% 70%, rgba(87, 204, 153, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, rgba(199, 249, 204, 0.6), transparent);
      background-size: 320px 320px;
      opacity: 0.75;
    }

    /* 3. Ember (Alchemical Red Ochre & Copper) */
    .realm-ember {
      background: 
        radial-gradient(circle at 50% 50%, rgba(46, 15, 10, 0.9) 0%, rgba(20, 6, 4, 0.96) 70%, #080201 100%);
    }
    .realm-ember::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 25% 20%, rgba(255, 159, 28, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 35%, rgba(255, 90, 54, 0.7), transparent),
        radial-gradient(2.5px 2.5px at 45% 80%, rgba(212, 175, 55, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, rgba(255, 183, 3, 0.6), transparent),
        radial-gradient(2px 2px at 15% 60%, rgba(230, 57, 70, 0.55), transparent);
      background-size: 340px 340px;
      opacity: 0.75;
    }

    /* 4. Abyss (Abyssal Sapphire Trench) */
    .realm-abyss {
      background: 
        radial-gradient(circle at 50% 50%, rgba(7, 29, 64, 0.9) 0%, rgba(3, 11, 28, 0.96) 70%, #01040a 100%);
    }
    .realm-abyss::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 30% 25%, rgba(0, 240, 255, 0.75), transparent),
        radial-gradient(1.5px 1.5px at 60% 55%, rgba(0, 187, 249, 0.65), transparent),
        radial-gradient(2.5px 2.5px at 20% 70%, rgba(72, 202, 228, 0.55), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(202, 240, 248, 0.7), transparent);
      background-size: 360px 360px;
      opacity: 0.7;
    }

    /* 5. Astral (Silver Aether & Eclipse) */
    .realm-astral {
      background: 
        radial-gradient(circle at 50% 50%, rgba(26, 28, 40, 0.9) 0%, rgba(10, 11, 16, 0.96) 70%, #030305 100%);
    }
    .realm-astral::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 18% 22%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2px 2px at 52% 68%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1px 1px at 78% 18%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.5px 1.5px at 35% 82%, rgba(182, 204, 254, 0.65), transparent);
      background-size: 300px 300px;
      opacity: 0.8;
    }

    /* 6. NYC (New York City Nocturne Skyline & River Reflections) */
    .realm-nyc {
      background: linear-gradient(
        180deg,
        #03060e 0%,
        #091326 42%,
        #162440 70%,
        #2b2238 86%,
        #070a12 100%
      );
    }
    .realm-nyc::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 48% 12%, rgba(255, 209, 102, 0.55), transparent),
        radial-gradient(1px 1px at 82% 22%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.5px 1.5px at 28% 32%, rgba(0, 240, 255, 0.45), transparent),
        radial-gradient(60% 28% at 50% 82%, rgba(255, 170, 50, 0.18), transparent);
      background-size: 400px 400px, 400px 400px, 400px 400px, 400px 400px, 100% 100%;
    }

    .nyc-skyline-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36vh;
      min-height: 240px;
      max-height: 380px;
      display: block;
    }

    .nyc-beacon {
      animation: beaconPulse 2.8s ease-in-out infinite alternate;
    }

    @keyframes beaconPulse {
      0% { opacity: 0.35; r: 2; }
      100% { opacity: 1; r: 3.6; }
    }

    /* 7. Wilderness (Nocturnal Forest Canopy, Stars & Luminous Moon) */
    .realm-wilderness {
      background: linear-gradient(
        180deg,
        #02040a 0%,
        #06101e 40%,
        #0b1d2c 72%,
        #071418 90%,
        #020608 100%
      );
    }
    .realm-wilderness::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.2px 1.2px at 14% 16%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.8px 1.8px at 32% 10%, rgba(168, 230, 207, 0.75), transparent),
        radial-gradient(1px 1px at 64% 18%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(2px 2px at 84% 12%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1.4px 1.4px at 48% 28%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 22% 40%, rgba(168, 230, 207, 0.55), transparent);
      background-size: 380px 380px;
      opacity: 0.85;
    }

    .wilderness-scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .wilderness-star-twinkle {
      animation: starPulse 3.6s ease-in-out infinite alternate;
    }

    @keyframes starPulse {
      0% { opacity: 0.35; }
      100% { opacity: 1; }
    }

    /* Top Title Banner */
    header {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 25;
      pointer-events: none;
      width: 90vw;
    }

    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 2.2vw, 2.1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 18px var(--hub-glow-primary), 0 0 35px var(--hub-glow-secondary);
      transition: text-shadow 1s ease;
    }

    header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #active-slice-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 14px;
      border-radius: 14px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-accent);
      border: 1px solid var(--gold-accent);
      background: rgba(8, 8, 16, 0.75);
      box-shadow: 0 0 14px var(--hub-glow-primary);
      transition: all 0.8s ease;
    }

    /* 3D Interactive Cosmic Viewport */
    #cosmos-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      perspective: 1400px;
    }

    #network-stage {
      position: relative;
      width: 1000px;
      height: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* 3D Disk Planes */
    .disk-plane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: 
        transform 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.15s ease;
      pointer-events: none;
    }

    .disk-plane.active-disk {
      transform: translate3d(0, 0, 0) rotateX(0deg) scale(1);
      opacity: 1;
      filter: blur(0px);
      pointer-events: auto;
      z-index: 8;
    }

    .disk-plane.inactive-disk-above {
      transform: translate3d(0, -210px, -520px) rotateX(68deg) rotateZ(-18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    .disk-plane.inactive-disk-below {
      transform: translate3d(0, 210px, -520px) rotateX(68deg) rotateZ(18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    /* Faint Outer Halo Ring for 3D Disks */
    .disk-halo-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 680px;
      height: 680px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 40px var(--hub-glow-primary);
      pointer-events: none;
    }

    /* SVG Connecting Ligaments Layer */
    .ligaments-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    .ligament-path {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 6;
      animation: pulseFlow 14s linear infinite;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.82;
    }

    .ligament-vine-main {
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.9;
    }

    .ligament-vine-tendril {
      fill: none;
      stroke-width: 1.4;
      stroke-dasharray: 4 3;
      stroke-linecap: round;
      animation: pulseFlow 18s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.7;
    }

    /* Suspension Bridge Filament Styles */
    .ligament-suspension-cable {
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.92;
    }

    .ligament-suspension-deck {
      fill: none;
      stroke-width: 1.8;
      stroke-dasharray: 7 5;
      stroke-linecap: round;
      animation: pulseFlow 12s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.85;
    }

    .ligament-suspension-struts {
      fill: none;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.55;
    }

    /* NYC Electric Grid & Subway Conduit Filament Styles */
    .ligament-grid-rail {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.85;
    }

    .ligament-grid-subrail {
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      opacity: 0.45;
    }

    .ligament-grid-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: bevel;
      stroke-dasharray: 18 150;
      animation: electricSurge 3.2s linear infinite;
      filter: drop-shadow(0 0 8px currentColor);
      opacity: 0.95;
    }

    .ligament-grid-station {
      fill: #050811;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 5px currentColor);
    }

    /* Gothic Wrought-Iron & Thorny Lancet Filament Styles */
    .ligament-gothic-spine {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.92;
    }

    .ligament-gothic-tracery {
      fill: none;
      stroke-width: 1.25;
      stroke-dasharray: 10 4 2 4;
      stroke-linecap: round;
      animation: pulseFlow 16s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.78;
    }

    .ligament-gothic-thorns {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 4px currentColor);
      opacity: 0.88;
    }

    .ligament-gothic-finial {
      fill: #050508;
      stroke-width: 1.6;
      filter: drop-shadow(0 0 6px currentColor);
    }

    /* Connecting Path Illumination for Focused/Hovered Portrait Portals */
    .portal-filament-group {
      transition: filter 0.28s ease, opacity 0.28s ease;
    }

    .portal-filament-group.is-illuminated path,
    .portal-filament-group.is-illuminated circle,
    .portal-filament-group.is-illuminated polygon {
      opacity: 1;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
    }

    @keyframes electricSurge {
      to { stroke-dashoffset: -336; }
    }

    /* Slender Alchemical Astrolabe Conduit Styles */
    .bridge-filament-group {
      cursor: pointer;
      pointer-events: auto;
    }

    /* Invisible 16px hit-target so the skinny line is still easy to click/hover */
    .bridge-hit-target {
      fill: none;
      stroke: transparent;
      stroke-width: 16;
      stroke-linecap: round;
    }

    .bridge-outer-aura {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 2.2;
      stroke-linecap: round;
      opacity: 0.16;
      filter: blur(1.5px);
      transition: opacity 0.35s ease, stroke-width 0.35s ease;
    }

    .bridge-core-path {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 1.15;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px var(--gold-accent));
      opacity: 0.92;
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }

    .bridge-astrolabe-arc {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 0.65;
      stroke-dasharray: 5 4;
      stroke-linecap: round;
      opacity: 0.52;
      animation: bridgePulse 14s linear infinite;
      transition: opacity 0.35s ease;
    }

    .bridge-astrolabe-ticks {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 0.75;
      stroke-linecap: round;
      opacity: 0.58;
      transition: opacity 0.35s ease;
    }

    .bridge-warp-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-dasharray: 14 280;
      animation: warpSurge 3.6s linear infinite;
      filter: drop-shadow(0 0 5px #ffffff) drop-shadow(0 0 8px var(--gold-accent));
    }

    .bridge-harmonic-node {
      fill: #050508;
      stroke: var(--gold-accent);
      stroke-width: 1.1;
      filter: drop-shadow(0 0 5px var(--gold-accent));
      transition: transform 0.35s ease, stroke 0.35s ease;
    }

    .bridge-filament-group:hover .bridge-outer-aura {
      opacity: 0.38;
      stroke-width: 3.5;
    }

    .bridge-filament-group:hover .bridge-core-path {
      stroke: #ffffff;
      stroke-width: 1.4;
    }

    .bridge-filament-group:hover .bridge-astrolabe-arc,
    .bridge-filament-group:hover .bridge-astrolabe-ticks {
      opacity: 0.9;
    }

    @keyframes bridgePulse {
      to { stroke-dashoffset: -180; }
    }

    @keyframes warpSurge {
      to { stroke-dashoffset: -588; }
    }

    /* Outlying Alchemical Armillary & Ouroboros Portal Node */
    .bridge-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 18;
      pointer-events: auto;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .bridge-node:hover {
      transform: translate(-50%, calc(-50% - 3px)) scale(1.06);
    }

    .bridge-sigil-ring {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(26, 18, 44, 0.92) 0%, rgba(5, 4, 10, 0.98) 78%);
      border: 1.25px solid rgba(212, 175, 55, 0.78);
      box-shadow:
        0 0 18px var(--hub-glow-primary),
        inset 0 0 14px rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .bridge-sigil-ring::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 0.85px solid rgba(212, 175, 55, 0.38);
      opacity: 0.8;
      pointer-events: none;
      transition: border-color 0.35s ease, opacity 0.35s ease;
    }

    .bridge-sigil-ring::after {
      content: "";
      position: absolute;
      inset: -11px;
      border-radius: 50%;
      border: 0.75px dashed rgba(255, 255, 255, 0.28);
      opacity: 0.5;
      animation: slowSpin 42s linear infinite;
      pointer-eve
