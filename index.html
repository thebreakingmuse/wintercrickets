<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esoteric Winter Crickets</title>
  <script>if (/#(invite|recovery|confirmation)_token=/.test(location.hash)) location.replace('/admin/' + location.hash);</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
      --text-main: #f0ece1;
      --text-muted: #9e978e;
    }

    /* Dynamic Realm Accent Variables on Body */
    body[data-realm="cosmos"] {
      --gold-accent: #d4af37;
      --hub-glow-primary: rgba(212, 175, 55, 0.35);
      --hub-glow-secondary: rgba(179, 102, 255, 0.25);
    }
    body[data-realm="verdant"] {
      --gold-accent: #00f5d4;
      --hub-glow-primary: rgba(0, 245, 212, 0.4);
      --hub-glow-secondary: rgba(56, 176, 0, 0.3);
    }
    body[data-realm="ember"] {
      --gold-accent: #ff9f1c;
      --hub-glow-primary: rgba(255, 159, 28, 0.4);
      --hub-glow-secondary: rgba(224, 30, 55, 0.3);
    }
    body[data-realm="abyss"] {
      --gold-accent: #00bbf9;
      --hub-glow-primary: rgba(0, 187, 249, 0.4);
      --hub-glow-secondary: rgba(0, 245, 212, 0.25);
    }
    body[data-realm="astral"] {
      --gold-accent: #e2eafc;
      --hub-glow-primary: rgba(226, 234, 252, 0.4);
      --hub-glow-secondary: rgba(163, 177, 204, 0.25);
    }
    body[data-realm="nyc"] {
      --gold-accent: #ffbe0b;
      --hub-glow-primary: rgba(255, 190, 11, 0.45);
      --hub-glow-secondary: rgba(0, 240, 255, 0.3);
    }
    body[data-realm="wilderness"] {
      --gold-accent: #a8e6cf;
      --hub-glow-primary: rgba(168, 230, 207, 0.4);
      --hub-glow-secondary: rgba(100, 181, 246, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050508;
      color: var(--text-main);
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      user-select: none;
    }

    /* Cross-Fading Realm Backdrop Layers */
    #realm-backdrops {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .realm-layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .realm-layer.active {
      opacity: 1;
    }

    /* 1. Cosmos (Obsidian & Violet) */
    .realm-cosmos {
      background: radial-gradient(circle at center, #0d0b18 0%, #050508 75%, #000000 100%);
    }
    .realm-cosmos::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 15% 25%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(1.5px 1.5px at 35% 65%, rgba(255, 209, 102, 0.5), transparent),
        radial-gradient(1px 1px at 55% 15%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(2px 2px at 75% 45%, rgba(179, 102, 255, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 25% 85%, rgba(255, 77, 121, 0.45), transparent);
      background-size: 350px 350px;
      opacity: 0.65;
    }

    /* 2. Verdant (Bioluminescent Canopy) */
    .realm-verdant {
      background: 
        radial-gradient(circle at 50% 50%, rgba(11, 59, 46, 0.85) 0%, rgba(4, 22, 18, 0.95) 65%, #020907 100%);
    }
    .realm-verdant::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(0, 245, 212, 0.75), transparent),
        radial-gradient(2.5px 2.5px at 65% 25%, rgba(128, 237, 153, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 40% 75%, rgba(0, 245, 212, 0.55), transparent),
        radial-gradient(3px 3px at 80% 70%, rgba(87, 204, 153, 0.5), transparent),
        radial-gradient(1.5px 1.5px at 15% 80%, rgba(199, 249, 204, 0.6), transparent);
      background-size: 320px 320px;
      opacity: 0.75;
    }

    /* 3. Ember (Alchemical Red Ochre & Copper) */
    .realm-ember {
      background: 
        radial-gradient(circle at 50% 50%, rgba(46, 15, 10, 0.9) 0%, rgba(20, 6, 4, 0.96) 70%, #080201 100%);
    }
    .realm-ember::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 25% 20%, rgba(255, 159, 28, 0.8), transparent),
        radial-gradient(1.5px 1.5px at 70% 35%, rgba(255, 90, 54, 0.7), transparent),
        radial-gradient(2.5px 2.5px at 45% 80%, rgba(212, 175, 55, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 85% 65%, rgba(255, 183, 3, 0.6), transparent),
        radial-gradient(2px 2px at 15% 60%, rgba(230, 57, 70, 0.55), transparent);
      background-size: 340px 340px;
      opacity: 0.75;
    }

    /* 4. Abyss (Abyssal Sapphire Trench) */
    .realm-abyss {
      background: 
        radial-gradient(circle at 50% 50%, rgba(7, 29, 64, 0.9) 0%, rgba(3, 11, 28, 0.96) 70%, #01040a 100%);
    }
    .realm-abyss::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 30% 25%, rgba(0, 240, 255, 0.75), transparent),
        radial-gradient(1.5px 1.5px at 60% 55%, rgba(0, 187, 249, 0.65), transparent),
        radial-gradient(2.5px 2.5px at 20% 70%, rgba(72, 202, 228, 0.55), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(202, 240, 248, 0.7), transparent);
      background-size: 360px 360px;
      opacity: 0.7;
    }

    /* 5. Astral (Silver Aether & Eclipse) */
    .realm-astral {
      background: 
        radial-gradient(circle at 50% 50%, rgba(26, 28, 40, 0.9) 0%, rgba(10, 11, 16, 0.96) 70%, #030305 100%);
    }
    .realm-astral::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 18% 22%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2px 2px at 52% 68%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1px 1px at 78% 18%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.5px 1.5px at 35% 82%, rgba(182, 204, 254, 0.65), transparent);
      background-size: 300px 300px;
      opacity: 0.8;
    }

    /* 6. NYC (New York City Nocturne Skyline & River Reflections) */
    .realm-nyc {
      background: linear-gradient(
        180deg,
        #03060e 0%,
        #091326 42%,
        #162440 70%,
        #2b2238 86%,
        #070a12 100%
      );
    }
    .realm-nyc::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 48% 12%, rgba(255, 209, 102, 0.55), transparent),
        radial-gradient(1px 1px at 82% 22%, rgba(255, 255, 255, 0.6), transparent),
        radial-gradient(1.5px 1.5px at 28% 32%, rgba(0, 240, 255, 0.45), transparent),
        radial-gradient(60% 28% at 50% 82%, rgba(255, 170, 50, 0.18), transparent);
      background-size: 400px 400px, 400px 400px, 400px 400px, 400px 400px, 100% 100%;
    }

    .nyc-skyline-svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 36vh;
      min-height: 240px;
      max-height: 380px;
      display: block;
    }

    .nyc-beacon {
      animation: beaconPulse 2.8s ease-in-out infinite alternate;
    }

    @keyframes beaconPulse {
      0% { opacity: 0.35; r: 2; }
      100% { opacity: 1; r: 3.6; }
    }

    /* 7. Wilderness (Nocturnal Forest Canopy, Stars & Luminous Moon) */
    .realm-wilderness {
      background: linear-gradient(
        180deg,
        #02040a 0%,
        #06101e 40%,
        #0b1d2c 72%,
        #071418 90%,
        #020608 100%
      );
    }
    .realm-wilderness::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.2px 1.2px at 14% 16%, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(1.8px 1.8px at 32% 10%, rgba(168, 230, 207, 0.75), transparent),
        radial-gradient(1px 1px at 64% 18%, rgba(255, 255, 255, 0.8), transparent),
        radial-gradient(2px 2px at 84% 12%, rgba(226, 234, 252, 0.75), transparent),
        radial-gradient(1.4px 1.4px at 48% 28%, rgba(255, 255, 255, 0.65), transparent),
        radial-gradient(1.5px 1.5px at 22% 40%, rgba(168, 230, 207, 0.55), transparent);
      background-size: 380px 380px;
      opacity: 0.85;
    }

    .wilderness-scene-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .wilderness-star-twinkle {
      animation: starPulse 3.6s ease-in-out infinite alternate;
    }

    @keyframes starPulse {
      0% { opacity: 0.35; }
      100% { opacity: 1; }
    }

    /* Top Title Banner */
    header {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 25;
      pointer-events: none;
      width: 90vw;
    }

    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 2.2vw, 2.1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-main);
      text-shadow: 0 0 18px var(--hub-glow-primary), 0 0 35px var(--hub-glow-secondary);
      transition: text-shadow 1s ease;
    }

    header p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #active-slice-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 14px;
      border-radius: 14px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-accent);
      border: 1px solid var(--gold-accent);
      background: rgba(8, 8, 16, 0.75);
      box-shadow: 0 0 14px var(--hub-glow-primary);
      transition: all 0.8s ease;
    }

    /* 3D Interactive Cosmic Viewport */
    #cosmos-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      perspective: 1400px;
    }

    #network-stage {
      position: relative;
      width: 1000px;
      height: 1000px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* 3D Disk Planes */
    .disk-plane {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: 
        transform 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1),
        filter 1.15s ease;
      pointer-events: none;
    }

    .disk-plane.active-disk {
      transform: translate3d(0, 0, 0) rotateX(0deg) scale(1);
      opacity: 1;
      filter: blur(0px);
      pointer-events: auto;
      z-index: 8;
    }

    .disk-plane.inactive-disk-above {
      transform: translate3d(0, -210px, -520px) rotateX(68deg) rotateZ(-18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    .disk-plane.inactive-disk-below {
      transform: translate3d(0, 210px, -520px) rotateX(68deg) rotateZ(18deg) scale(0.72);
      opacity: 0.16;
      filter: blur(1.5px);
      pointer-events: none;
      z-index: 3;
    }

    /* Faint Outer Halo Ring for 3D Disks */
    .disk-halo-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 680px;
      height: 680px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 40px var(--hub-glow-primary);
      pointer-events: none;
    }

    /* SVG Connecting Ligaments Layer */
    .ligaments-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    .ligament-path {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 8 6;
      animation: pulseFlow 14s linear infinite;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.82;
    }

    .ligament-vine-main {
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.9;
    }

    .ligament-vine-tendril {
      fill: none;
      stroke-width: 1.4;
      stroke-dasharray: 4 3;
      stroke-linecap: round;
      animation: pulseFlow 18s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.7;
    }

    /* Suspension Bridge Filament Styles */
    .ligament-suspension-cable {
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.92;
    }

    .ligament-suspension-deck {
      fill: none;
      stroke-width: 1.8;
      stroke-dasharray: 7 5;
      stroke-linecap: round;
      animation: pulseFlow 12s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.85;
    }

    .ligament-suspension-struts {
      fill: none;
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.55;
    }

    /* NYC Electric Grid & Subway Conduit Filament Styles */
    .ligament-grid-rail {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      filter: drop-shadow(0 0 6px currentColor);
      opacity: 0.85;
    }

    .ligament-grid-subrail {
      fill: none;
      stroke-width: 1.1;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      opacity: 0.45;
    }

    .ligament-grid-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: bevel;
      stroke-dasharray: 18 150;
      animation: electricSurge 3.2s linear infinite;
      filter: drop-shadow(0 0 8px currentColor);
      opacity: 0.95;
    }

    .ligament-grid-station {
      fill: #050811;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 5px currentColor);
    }

    /* Gothic Wrought-Iron & Thorny Lancet Filament Styles */
    .ligament-gothic-spine {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: butt;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 7px currentColor);
      opacity: 0.92;
    }

    .ligament-gothic-tracery {
      fill: none;
      stroke-width: 1.25;
      stroke-dasharray: 10 4 2 4;
      stroke-linecap: round;
      animation: pulseFlow 16s linear infinite;
      filter: drop-shadow(0 0 5px currentColor);
      opacity: 0.78;
    }

    .ligament-gothic-thorns {
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: square;
      stroke-linejoin: miter;
      filter: drop-shadow(0 0 4px currentColor);
      opacity: 0.88;
    }

    .ligament-gothic-finial {
      fill: #050508;
      stroke-width: 1.6;
      filter: drop-shadow(0 0 6px currentColor);
    }

    @keyframes electricSurge {
      to { stroke-dashoffset: -336; }
    }

    /* Long Dimensional Shift Rift Conduit Styles */
    .bridge-filament-group {
      cursor: pointer;
      pointer-events: auto;
    }

    .bridge-outer-aura {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 10;
      stroke-linecap: round;
      opacity: 0.14;
      filter: blur(5px);
      transition: opacity 0.35s ease, stroke-width 0.35s ease;
    }

    .bridge-core-path {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 3;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px var(--gold-accent)) drop-shadow(0 0 22px var(--gold-accent));
      stroke-dasharray: 14 8;
      animation: bridgePulse 5s linear infinite;
    }

    .bridge-helix-path {
      fill: none;
      stroke: #ffffff;
      stroke-width: 1.35;
      stroke-linecap: round;
      opacity: 0.72;
      filter: drop-shadow(0 0 8px var(--gold-accent));
    }

    .bridge-helix-secondary {
      fill: none;
      stroke: var(--gold-accent);
      stroke-width: 1.2;
      stroke-dasharray: 4 6;
      stroke-linecap: round;
      opacity: 0.8;
      animation: bridgePulse 8s linear infinite reverse;
    }

    .bridge-warp-surge {
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-dasharray: 26 260;
      animation: warpSurge 2.8s linear infinite;
      filter: drop-shadow(0 0 12px #ffffff) drop-shadow(0 0 20px var(--gold-accent));
    }

    .bridge-portal-gate {
      fill: rgba(10, 8, 20, 0.35);
      stroke: var(--gold-accent);
      stroke-width: 1.4;
      stroke-dasharray: 5 3;
      filter: drop-shadow(0 0 8px var(--gold-accent));
      animation: gateBreathe 2.6s ease-in-out infinite alternate;
    }

    .bridge-filament-group:hover .bridge-outer-aura {
      opacity: 0.32;
      stroke-width: 15;
    }

    @keyframes bridgePulse {
      to { stroke-dashoffset: -220; }
    }

    @keyframes warpSurge {
      to { stroke-dashoffset: -572; }
    }

    @keyframes gateBreathe {
      0% { stroke-opacity: 0.45; }
      100% { stroke-opacity: 1; }
    }

    /* Outlying Dimensional Shift Portal Node */
    .bridge-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 18;
      pointer-events: auto;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .bridge-node:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }

    .bridge-sigil-ring {
      position: relative;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34, 24, 60, 0.95) 0%, rgba(5, 4, 12, 0.98) 78%);
      border: 2px solid var(--gold-accent);
      box-shadow: 
        0 0 25px var(--gold-accent),
        0 0 55px var(--hub-glow-primary),
        inset 0 0 18px var(--gold-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
    }

    /* Outer Orbiting Rift Halo around Dimensional Shift Node */
    .bridge-sigil-ring::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px dashed var(--gold-accent);
      opacity: 0.65;
      animation: slowSpinReverse 22s linear infinite;
      pointer-events: none;
    }

    .bridge-sigil-ring::after {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px dotted rgba(255, 255, 255, 0.45);
      opacity: 0.5;
      animation: slowSpin 30s linear infinite;
      pointer-events: none;
    }

    .bridge-node:hover .bridge-sigil-ring {
      border-color: #ffffff;
      box-shadow: 
        0 0 35px var(--gold-accent),
        0 0 75px var(--gold-accent),
        0 0 110px var(--gold-accent),
        inset 0 0 26px var(--gold-accent);
    }

    .bridge-sigil-svg {
      width: 56px;
      height: 56px;
      color: var(--gold-accent);
      animation: slowSpin 18s linear infinite;
    }

    .bridge-label {
      margin-top: 14px;
      text-align: center;
      background: rgba(8, 6, 16, 0.9);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 18px;
      border: 1px solid var(--gold-accent);
      box-shadow: 0 0 18px var(--hub-glow-primary);
    }

    .bridge-title {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold-accent);
      white-space: nowrap;
    }

    .bridge-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--text-main);
      white-space: nowrap;
    }

    @keyframes pulseFlow {
      to { stroke-dashoffset: -140; }
    }

    /* Central Sacred Geometry Hub */
    .center-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 170px;
      height: 170px;
      border-radius: 50%;
      z-index: 14;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(22, 16, 40, 0.95) 0%, rgba(7, 5, 14, 0.98) 75%);
      box-shadow: 
        0 0 35px var(--hub-glow-primary),
        0 0 70px var(--hub-glow-secondary),
        inset 0 0 25px var(--hub-glow-primary);
      border: 1.5px solid var(--gold-accent);
      transition: box-shadow 1s ease, border-color 1s ease;
    }

    .hub-geometry {
      width: 146px;
      height: 146px;
      animation: slowSpin 50s linear infinite;
    }

    /* Orbiting Winter Crickets */
    .cricket-orbit {
      position: absolute;
      width: 232px;
      height: 232px;
      border-radius: 50%;
      border: 1px dashed rgba(212, 175, 55, 0.3);
      animation: slowSpinReverse 65s linear infinite;
      pointer-events: none;
    }

    .cricket-icon {
      position: absolute;
      width: 42px;
      height: 42px;
      color: var(--gold-accent);
      filter: drop-shadow(0 0 6px var(--gold-accent));
      overflow: visible;
      transition: color 1s ease, filter 1s ease;
    }

    .cricket-icon.top {
      top: -21px;
      left: calc(50% - 21px);
      transform: rotate(-90deg);
    }
    .cricket-icon.bottom {
      bottom: -21px;
      left: calc(50% - 21px);
      transform: rotate(90deg);
    }
    .cricket-icon.left {
      left: -21px;
      top: calc(50% - 21px);
      transform: rotate(180deg);
    }
    .cricket-icon.right {
      right: -21px;
      top: calc(50% - 21px);
      transform: rotate(0deg);
    }

    /* Cricket Leg & Antenna Articulation Animations */
    .cricket-leg,
    .cricket-antenna,
    .cricket-body {
      transform-box: view-box;
    }

    .leg-fl { transform-origin: 28px 21px; }
    .leg-fr { transform-origin: 36px 21px; }
    .leg-ml { transform-origin: 27px 28px; }
    .leg-mr { transform-origin: 37px 28px; }
    .leg-hl { transform-origin: 28px 35px; }
    .leg-hr { transform-origin: 36px 35px; }
    .ant-l  { transform-origin: 29px 15px; }
    .ant-r  { transform-origin: 35px 15px; }
    .cricket-body { transform-origin: 32px 32px; }

    .gait-a.leg-fl,
    .gait-a.leg-hl {
      animation: swingLeftLeg 0.55s ease-in-out infinite alternate;
    }
    .gait-a.leg-mr {
      animation: swingRightLeg 0.55s ease-in-out infinite alternate;
    }

    .gait-b.leg-fr,
    .gait-b.leg-hr {
      animation: swingRightLeg 0.55s ease-in-out infinite alternate-reverse;
    }
    .gait-b.leg-ml {
      animation: swingLeftLeg 0.55s ease-in-out infinite alternate-reverse;
    }

    .ant-l {
      animation: feelerLeft 1.1s ease-in-out infinite alternate;
    }
    .ant-r {
      animation: feelerRight 1.3s ease-in-out infinite alternate;
    }

    .cricket-body {
      animation: bodySway 0.55s ease-in-out infinite alternate;
    }

    @keyframes swingLeftLeg {
      0%   { transform: rotate(-13deg) translateY(1px); }
      100% { transform: rotate(15deg) translateY(-1px); }
    }

    @keyframes swingRightLeg {
      0%   { transform: rotate(-15deg) translateY(-1px); }
      100% { transform: rotate(13deg) translateY(1px); }
    }

    @keyframes feelerLeft {
      0%   { transform: rotate(-9deg); }
      100% { transform: rotate(11deg); }
    }

    @keyframes feelerRight {
      0%   { transform: rotate(9deg); }
      100% { transform: rotate(-11deg); }
    }

    @keyframes bodySway {
      0%   { transform: rotate(-2.2deg) translateY(-0.6px); }
      100% { transform: rotate(2.2deg) translateY(0.6px); }
    }

    @keyframes slowSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes slowSpinReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Portal Branch Nodes */
    .portal-node {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 12;
      transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .portal-node:hover {
      transform: translate(-50%, -50%) scale(1.12);
      z-index: 15;
    }

    .portal-ring {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      padding: 5px;
      background: radial-gradient(circle, rgba(15, 15, 25, 0.9), rgba(5, 5, 10, 0.98));
      border: 2px solid var(--node-border, #d4af37);
      box-shadow: 
        0 0 22px var(--node-glow, rgba(212, 175, 55, 0.5)),
        inset 0 0 14px var(--node-glow, rgba(212, 175, 55, 0.4));
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
      overflow: hidden;
    }

    /* Multi-Layer Glowing Aura on Hover */
    .portal-node:hover .portal-ring {
      border-color: var(--text-main);
      box-shadow: 
        0 0 30px var(--node-glow),
        0 0 60px var(--node-glow),
        0 0 90px var(--node-glow),
        inset 0 0 22px var(--node-glow);
    }

    .portal-ring::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px dashed var(--node-border);
      opacity: 0.65;
      animation: slowSpin 28s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .portal-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      transition: transform 0.5s ease;
    }

    .portal-node:hover .portal-thumb {
      transform: scale(1.08);
    }

    .portal-label {
      margin-top: 10px;
      text-align: center;
      background: rgba(6, 5, 12, 0.78);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.65);
    }

    .portal-title {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-main);
      text-shadow: 0 0 10px var(--node-glow);
      white-space: nowrap;
    }

    .portal-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* The opening disc's two personal doorways. */
    body.landing-disc-active #network-stage {
      flex-shrink: 0;
    }

    button.introduction-node {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .introduction-node .portal-ring {
      width: 190px;
      height: 190px;
      padding: 9px;
      border-width: 1px;
      background: radial-gradient(circle at 45% 35%, rgba(40, 29, 55, 0.95), #080610 75%);
      box-shadow: 0 0 36px var(--node-glow), 0 0 80px rgba(5, 4, 13, 0.6), inset 0 0 30px var(--node-glow);
    }

    .introduction-sigil {
      display: block;
      width: 100%;
      height: 100%;
      color: var(--node-border);
      filter: drop-shadow(0 0 9px var(--node-glow));
    }

    .introduction-sigil text {
      fill: currentColor;
      font-family: 'Cinzel Decorative', serif;
      font-size: 35px;
      text-anchor: middle;
    }

    .introduction-node .portal-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 18px;
      padding: 9px 22px;
      border-color: var(--node-border);
    }

    .introduction-node .portal-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.6rem;
      letter-spacing: 0.15em;
    }

    .introduction-node .portal-subtitle {
      font-size: 1.05rem;
    }

    .introduction-node:focus-visible {
      outline: 2px solid var(--text-main);
      outline-offset: 12px;
      border-radius: 28px;
    }

    /* Color Themes */
    .theme-nocturnal {
      --node-color: #b366ff;
      --node-glow: rgba(179, 102, 255, 0.6);
      --node-border: #d9b3ff;
    }

    .theme-cyber {
      --node-color: #00f0ff;
      --node-glow: rgba(0, 240, 255, 0.6);
      --node-border: #99f9ff;
    }

    .theme-celestial {
      --node-color: #ffd166;
      --node-glow: rgba(255, 209, 102, 0.6);
      --node-border: #ffe8a3;
    }

    .theme-oceanic {
      --node-color: #00f5d4;
      --node-glow: rgba(0, 245, 212, 0.6);
      --node-border: #9bfbee;
    }

    .theme-rose {
      --node-color: #ff4d79;
      --node-glow: rgba(255, 77, 121, 0.65);
      --node-border: #ffb3c6;
    }

    /* Gallery Modal Overlay */
    #gallery-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 6, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }

    #gallery-modal.active {
      display: flex;
    }

    .modal-content-box {
      width: min(94vw, 1150px);
      height: 85vh;
      max-height: 85vh;
      background: rgba(10, 8, 18, 0.96);
      backdrop-filter: blur(16px);
      color: var(--text-main);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(179, 102, 255, 0.22);
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 16px;
      margin-bottom: 22px;
    }

    .modal-title-group h2 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      color: var(--text-main);
    }

    .modal-title-group p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .close-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      font-family: 'Cinzel', serif;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: all 0.25s ease;
    }

    .close-btn:hover {
      border-color: var(--gold-accent);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    /* A poem emerges inside the same portal overlay as the archives. */
    #gallery-modal.poem-mode .modal-content-box {
      width: min(94vw, 780px);
      height: 86vh;
      height: 86svh;
      max-height: 860px;
      border-color: var(--poem-border, var(--gold-accent));
      background: radial-gradient(ellipse at 50% 0%, var(--poem-glow, rgba(179, 102, 255, 0.15)), transparent 65%), rgba(10, 8, 18, 0.98);
      box-shadow: 0 0 65px rgba(0, 0, 0, 0.85), 0 0 35px var(--poem-glow);
    }

    #modal-poem-panel[hidden] { display: none; }

    #modal-poem-panel {
      overflow-y: auto;
      overscroll-behavior: contain;
      user-select: text;
      padding: 6px clamp(4px, 4vw, 32px) 36px;
      scrollbar-color: var(--poem-border) transparent;
    }

    .poem-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 400;
      color: var(--poem-border, var(--text-main));
      letter-spacing: 0.08em;
      margin: 0 0 24px;
    }

    .poem-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 2.2vw, 1.65rem);
      line-height: 1.65;
      color: var(--text-main);
    }

    .poem-text.emerging {
      animation: poemEmerge 950ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .poem-empty {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-style: italic;
      color: var(--text-muted);
      margin-top: 32px;
    }

    @keyframes poemEmerge {
      from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .poem-text.emerging { animation: none; }
    }

    /* Password Lock Screen View */
    #lock-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      gap: 16px;
    }

    #lock-screen.active {
      display: flex;
    }

    #lock-screen p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--gold-accent);
      letter-spacing: 0.08em;
    }

    .lock-input {
      background: rgba(5, 5, 10, 0.9);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      text-align: center;
      width: min(320px, 80vw);
      outline: none;
      letter-spacing: 0.15em;
    }

    .lock-input:focus {
      border-color: var(--gold-accent);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .unlock-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-accent);
      color: var(--gold-accent);
      font-family: 'Cinzel', serif;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: all 0.25s ease;
    }

    .unlock-btn:hover {
      background: var(--gold-accent);
      color: #000;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }

    .lock-error {
      color: #ff4d79;
      font-size: 0.85rem;
      font-style: italic;
      height: 20px;
    }

    /* Bulletproof Non-Overlapping Grid Container with Explicit Row Height */
    .photo-grid {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-rows: 220px;
      align-content: start;
      gap: 18px;
      overflow-y: auto;
      padding-right: 6px;
      height: 100%;
      min-height: 0;
    }

    .photo-grid.active {
      display: grid;
    }

    .photo-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: radial-gradient(circle, #141124 0%, #08070f 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      height: 220px;
      cursor: zoom-in;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 18px rgba(212, 175, 55, 0.3);
      border-color: rgba(212, 175, 55, 0.5);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .photo-card img.loaded {
      opacity: 1;
    }

    /* Fullscreen Lightbox Overlay */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 2, 5, 0.96);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: zoom-out;
      padding: 24px;
    }

    #lightbox.active {
      display: flex;
    }

    #lightbox img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    /* Discreet Sanctum Sigil Link to /admin/ */
    .sanctum-sigil-link {
      position: fixed;
      bottom: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      z-index: 50;
      color: var(--gold-accent);
      opacity: 0.14;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 
        opacity 0.4s ease,
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.4s ease,
        color 1s ease;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sanctum-sigil-link:hover,
    .sanctum-sigil-link:focus-visible {
      opacity: 0.95;
      transform: scale(1.18) rotate(45deg);
      filter: drop-shadow(0 0 8px var(--gold-accent)) drop-shadow(0 0 18px var(--hub-glow-primary));
    }

    .sanctum-sigil-link svg {
      width: 28px;
      height: 28px;
    }

    @media (max-width: 768px) {
      #network-stage {
        transform: scale(0.58);
      }
      .portal-ring {
        width: 96px;
        height: 96px;
      }
      body.landing-disc-active #network-stage { transform: scale(0.5); }
    }

    @media (max-width: 600px) {
      body.landing-disc-active #network-stage { transform: scale(0.42); }
      #gallery-modal.poem-mode { padding: 12px; }
      #gallery-modal.poem-mode .modal-content-box { padding: 22px 18px; }
      #gallery-modal.poem-mode .modal-title-group h2 { font-size: 1.25rem; }
      #gallery-modal.poem-mode .close-btn { padding: 8px 10px; font-size: 0.72rem; }
    }

    @media (max-width: 360px) {
      body.landing-disc-active #network-stage { transform: scale(0.35); }
    }
  </style>

    document.querySelectorAll('.cricket-icon').forEach((svgEl, idx) => {
      svgEl.innerHTML = CRICKET_SVG_MARKUP;

    const disksContainer = document.getElementById('disks-container');
    const activeSliceBadge = document.getElementById('active-slice-badge');

    const modalPoemPanel = document.getElementById('modal-poem-panel');

    let sliceList = [];
    let currentSliceIndex = 0;
    let introductionTrigger = null;

    function buildCurvedPath(x1, y1, x2, y2, index, bendFactor = 0.18) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const offsetDirection = index % 2 === 0 ? 1 : -1;
      const ctrlX = midX - dy * bendFactor * offsetDirection;
      const ctrlY = midY + dx * bendFactor * offsetDirection;
      return `M ${x1} ${y1} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`;
    }

    function buildWavePath(x1, y1, x2, y2, phase = 1) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const c1x = x1 + dx * 0.33 - dy * 0.14 * phase;
      const c1y = y1 + dy * 0.33 + dx * 0.14 * phase;
      const c2x = x1 + dx * 0.66 + dy * 0.14 * phase;
      const c2y = y1 + dy * 0.66 - dx * 0.14 * phase;
      return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
    }

    // Long Multi-Frequency Sine Wave Conduit for the Dimensional Shift Bridge
    function buildDimensionalRiftPath(x1, y1, x2, y2, waves = 5, amplitude = 16, phase = 1) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const steps = 64;
      let d = `M ${x1} ${y1}`;

      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const envelope = Math.sin(t * Math.PI);
        const archOffset = Math.sin(t * Math.PI * 2) * 24;
        const waveOffset = Math.sin(t * Math.PI * waves) * amplitude * phase * envelope;
        const totalNormal = archOffset + waveOffset;

        const px = x1 + dx * t + nx * totalNormal;
        const py = y1 + dy * t + ny * totalNormal;
        d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`;
      }
      return d;
    }

    // Picks an outlying corner angle that stays clear of existing portals on that slice
    function chooseBridgeAngle(sliceItems) {
      const preferredCorners = [-32, -148, 32, 148, -90];
      const usedAngles = sliceItems.map((b, i) => b.angle ?? (i * 60));
      for (const candidate of preferredCorners) {
        const isClear = usedAngles.every((a) => Math.abs(((candidate - a + 540) % 360) - 180) >= 26);
        if (isClear) return candidate;
      }
      return -32;
    }

    function renderFilament(svgGroup, x2, y2, idx, theme, filamentStyle) {
      const color = themeColors[theme] || themeColors.nocturnal;

      if (filamentStyle === 'vine') {
        const mainVine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        mainVine.setAttribute('d', buildWavePath(CENTER_X, CENTER_Y, x2, y2, 1));
        mainVine.setAttribute('class', 'ligament-vine-main');
        mainVine.setAttribute('stroke', `url(#grad-${theme})`);
        mainVine.style.color = color;
        svgGroup.appendChild(mainVine);

        const offTendril = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        offTendril.setAttribute('d', buildWavePath(CENTER_X, CENTER_Y, x2, y2, -0.85));
        offTendril.setAttribute('class', 'ligament-vine-tendril');
        offTendril.setAttribute('stroke', color);
        offTendril.style.color = color;
        svgGroup.appendChild(offTendril);

      } else if (filamentStyle === 'tendril') {
        const strandA = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strandA.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx, 0.22));
        strandA.setAttribute('class', 'ligament-path');
        strandA.setAttribute('stroke', `url(#grad-${theme})`);
        strandA.style.color = color;
        svgGroup.appendChild(strandA);

        const strandB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strandB.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx + 1, 0.16));
        strandB.setAttribute('class', 'ligament-vine-tendril');
        strandB.setAttribute('stroke', color);
        strandB.style.color = color;
        svgGroup.appendChild(strandB);

      } else if (filamentStyle === 'suspension') {
        const midX = (CENTER_X + x2) / 2;
        const midY = (CENTER_Y + y2) / 2;
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const dir = idx % 2 === 0 ? 1 : -1;
        const ctrlX = midX - dy * 0.24 * dir;
        const ctrlY = midY + dx * 0.24 * dir;

        let strutsD = '';
        const steps = [0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.82];
        steps.forEach((t) => {
          const inv = 1 - t;
          const lx = inv * CENTER_X + t * x2;
          const ly = inv * CENTER_Y + t * y2;
          const cx = inv * inv * CENTER_X + 2 * inv * t * ctrlX + t * t * x2;
          const cy = inv * inv * CENTER_Y + 2 * inv * t * ctrlY + t * t * y2;
          strutsD += `M ${lx.toFixed(1)} ${ly.toFixed(1)} L ${cx.toFixed(1)} ${cy.toFixed(1)} `;
        });

        const strutsPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strutsPath.setAttribute('d', strutsD.trim());
        strutsPath.setAttribute('class', 'ligament-suspension-struts');
        strutsPath.setAttribute('stroke', color);
        svgGroup.appendChild(strutsPath);

        const deckPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        deckPath.setAttribute('d', `M ${CENTER_X} ${CENTER_Y} L ${x2} ${y2}`);
        deckPath.setAttribute('class', 'ligament-suspension-deck');
        deckPath.setAttribute('stroke', `url(#grad-${theme})`);
        deckPath.style.color = color;
        svgGroup.appendChild(deckPath);

        const cablePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        cablePath.setAttribute('d', `M ${CENTER_X} ${CENTER_Y} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`);
        cablePath.setAttribute('class', 'ligament-suspension-cable');
        cablePath.setAttribute('stroke', color);
        cablePath.style.color = color;
        svgGroup.appendChild(cablePath);

      } else if (filamentStyle === 'grid') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = idx % 2 === 0 ? 1 : -1;
        const nx = (-dy / len) * dir;
        const ny = (dx / len) * dir;
        const offset = 26;

        const p1x = CENTER_X + dx * 0.34 + nx * offset;
        const p1y = CENTER_Y + dy * 0.34 + ny * offset;
        const p2x = CENTER_X + dx * 0.68 + nx * offset;
        const p2y = CENTER_Y + dy * 0.68 + ny * offset;
        const mainD = `M ${CENTER_X} ${CENTER_Y} L ${p1x.toFixed(1)} ${p1y.toFixed(1)} L ${p2x.toFixed(1)} ${p2y.toFixed(1)} L ${x2} ${y2}`;

        const subOffset = offset - 9;
        const s1x = CENTER_X + dx * 0.34 + nx * subOffset;
        const s1y = CENTER_Y + dy * 0.34 + ny * subOffset;
        const s2x = CENTER_X + dx * 0.68 + nx * subOffset;
        const s2y = CENTER_Y + dy * 0.68 + ny * subOffset;
        const subD = `M ${CENTER_X} ${CENTER_Y} L ${s1x.toFixed(1)} ${s1y.toFixed(1)} L ${s2x.toFixed(1)} ${s2y.toFixed(1)} L ${x2} ${y2}`;

        const subRail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        subRail.setAttribute('d', subD);
        subRail.setAttribute('class', 'ligament-grid-subrail');
        subRail.setAttribute('stroke', color);
        svgGroup.appendChild(subRail);

        const mainRail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        mainRail.setAttribute('d', mainD);
        mainRail.setAttribute('class', 'ligament-grid-rail');
        mainRail.setAttribute('stroke', `url(#grad-${theme})`);
        mainRail.style.color = color;
        svgGroup.appendChild(mainRail);

        const surgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        surgePath.setAttribute('d', mainD);
        surgePath.setAttribute('class', 'ligament-grid-surge');
        surgePath.style.color = color;
        svgGroup.appendChild(surgePath);

        [[p1x, p1y], [p2x, p2y]].forEach(([jx, jy]) => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', jx.toFixed(1));
          dot.setAttribute('cy', jy.toFixed(1));
          dot.setAttribute('r', '3.4');
          dot.setAttribute('class', 'ligament-grid-station');
          dot.setAttribute('stroke', color);
          dot.style.color = color;
          svgGroup.appendChild(dot);
        });

      } else if (filamentStyle === 'gothic') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = idx % 2 === 0 ? 1 : -1;
        const nx = (-dy / len) * dir;
        const ny = (dx / len) * dir;

        // 1. Pointed Gothic Lancet Arch Spine
        const peakX = CENTER_X + dx * 0.5 + nx * 28;
        const peakY = CENTER_Y + dy * 0.5 + ny * 28;
        const c1x = CENTER_X + dx * 0.22 + nx * 22;
        const c1y = CENTER_Y + dy * 0.22 + ny * 22;
        const c2x = CENTER_X + dx * 0.78 + nx * 22;
        const c2y = CENTER_Y + dy * 0.78 + ny * 22;
        const lancetD = `M ${CENTER_X} ${CENTER_Y} Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${peakX.toFixed(1)} ${peakY.toFixed(1)} Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${x2} ${y2}`;

        // 2. Counter-Curving Sub-Tracery Arch
        const counterPeakX = CENTER_X + dx * 0.5 - nx * 16;
        const counterPeakY = CENTER_Y + dy * 0.5 - ny * 16;
        const cc1x = CENTER_X + dx * 0.25 - nx * 12;
        const cc1y = CENTER_Y + dy * 0.25 - ny * 12;
        const cc2x = CENTER_X + dx * 0.75 - nx * 12;
        const cc2y = CENTER_Y + dy * 0.75 - ny * 12;
        const traceryD = `M ${CENTER_X} ${CENTER_Y} Q ${cc1x.toFixed(1)} ${cc1y.toFixed(1)} ${counterPeakX.toFixed(1)} ${counterPeakY.toFixed(1)} Q ${cc2x.toFixed(1)} ${cc2y.toFixed(1)} ${x2} ${y2}`;

        // 3. Wrought-Iron Spikes / Briar Thorns along the Span
        let thornsD = '';
        const thornSteps = [0.22, 0.36, 0.5, 0.64, 0.78];
        thornSteps.forEach((t, tIdx) => {
          const bx = CENTER_X + dx * t;
          const by = CENTER_Y + dy * t;
          const spikeLen = t === 0.5 ? 24 : (tIdx % 2 === 0 ? 15 : 19);
          const s1x = bx + nx * spikeLen;
          const s1y = by + ny * spikeLen;
          const s2x = bx - nx * (spikeLen * 0.75);
          const s2y = by - ny * (spikeLen * 0.75);
          thornsD += `M ${s2x.toFixed(1)} ${s2y.toFixed(1)} L ${s1x.toFixed(1)} ${s1y.toFixed(1)} `;
        });

        const thornsPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        thornsPath.setAttribute('d', thornsD.trim());
        thornsPath.setAttribute('class', 'ligament-gothic-thorns');
        thornsPath.setAttribute('stroke', color);
        thornsPath.style.color = color;
        svgGroup.appendChild(thornsPath);

        const traceryPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        traceryPath.setAttribute('d', traceryD);
        traceryPath.setAttribute('class', 'ligament-gothic-tracery');
        traceryPath.setAttribute('stroke', color);
        traceryPath.style.color = color;
        svgGroup.appendChild(traceryPath);

        const spinePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        spinePath.setAttribute('d', lancetD);
        spinePath.setAttribute('class', 'ligament-gothic-spine');
        spinePath.setAttribute('stroke', `url(#grad-${theme})`);
        spinePath.style.color = color;
        svgGroup.appendChild(spinePath);

        // 4. Diamond Iron Finials at Key Nodes
        [0.36, 0.5, 0.64].forEach((t) => {
          const fx = CENTER_X + dx * t;
          const fy = CENTER_Y + dy * t;
          const size = t === 0.5 ? 5.5 : 4;
          const diamond = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const pTop = `${(fx + nx * size).toFixed(1)},${(fy + ny * size).toFixed(1)}`;
          const pRight = `${(fx + (dx / len) * size).toFixed(1)},${(fy + (dy / len) * size).toFixed(1)}`;
          const pBot = `${(fx - nx * size).toFixed(1)},${(fy - ny * size).toFixed(1)}`;
          const pLeft = `${(fx - (dx / len) * size).toFixed(1)},${(fy - (dy / len) * size).toFixed(1)}`;
          diamond.setAttribute('points', `${pTop} ${pRight} ${pBot} ${pLeft}`);
          diamond.setAttribute('class', 'ligament-gothic-finial');
          diamond.setAttribute('stroke', color);
          diamond.style.color = color;
          svgGroup.appendChild(diamond);
        });

      } else {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx));
        path.setAttribute('class', 'ligament-path');
        path.setAttribute('stroke', `url(#grad-${theme})`);
        path.style.color = color;
        svgGroup.appendChild(path);
      }
    }

    function applyRealmAesthetic(realmId, sliceName) {
      const validRealms = ['cosmos', 'verdant', 'ember', 'abyss', 'astral', 'nyc', 'wilderness'];
      const targetRealm = validRealms.includes(realmId) ? realmId : 'cosmos';

      document.body.setAttribute('data-realm', targetRealm);

      document.querySelectorAll('.realm-layer').forEach((layer) => {
        if (layer.getAttribute('data-realm-id') === targetRealm) {
          layer.classList.add('active');
        } else {
          layer.classList.remove('active');
        }
      });

      if (sliceList.length > 1) {
        activeSliceBadge.style.display = 'inline-block';
        activeSliceBadge.textContent = `Active Disk: ${sliceName}`;
      }
    }

    function switchToSlice(targetIndex) {
      currentSliceIndex = targetIndex;
      const activeSlice = sliceList[currentSliceIndex];
      applyRealmAesthetic(activeSlice.bg, activeSlice.name);
      document.body.classList.toggle('landing-disc-active', Boolean(activeSlice.isLanding));

      const diskEls = document.querySelectorAll('.disk-plane');
      diskEls.forEach((el, idx) => {
        el.inert = idx !== currentSliceIndex;
        el.setAttribute('aria-hidden', idx === currentSliceIndex ? 'false' : 'true');
        el.classList.remove('active-disk', 'inactive-disk-above', 'inactive-disk-below');
        if (idx === currentSliceIndex) {
          el.classList.add('active-disk');
        } else if (idx < currentSliceIndex) {
          el.classList.add('inactive-disk-above');
        } else {
          el.classList.add('inactive-disk-below');
        }
      });
    }

    function renderPhotoGrid(branch) {
      modalPhotoGrid.innerHTML = '';
      const photos = branch.photos || [];
      const thumbs = branch.grid_thumbs || [];

      photos.forEach((fullPhotoPath, idx) => {
        const previewPath = thumbs[idx] || fullPhotoPath;

        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = previewPath;
        img.alt = branch.title || 'Portal image';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.addEventListener('load', () => img.classList.add('loaded'));

        img.addEventListener('error', () => {
          if (img.src !== fullPhotoPath) img.src = fullPhotoPath;
        });

        card.appendChild(img);

        card.addEventListener('click', () => {
          lightboxImg.src = fullPhotoPath;
          lightbox.classList.add('active');
        });

        modalPhotoGrid.appendChild(card);
      });
    }

    function showPortalContent(branch) {
      if (branch.portal_type === 'introduction') {
        const poem = typeof branch.poem_text === 'string' ? branch.poem_text : '';
        modalPhotoGrid.classList.remove('active');
        modalPoemTitle.textContent = branch.poem_title || '';
        modalPoemTitle.hidden = !branch.poem_title;
        const verse = document.createElement('div');
        verse.className = 'poem-text emerging';
        verse.id = 'modal-poem-text';
        verse.style.fontStyle = branch.poem_italic ? 'italic' : 'normal';
        verse.textContent = poem;
        modalPoemText.replaceWith(verse);
        modalPoemText = verse;
        modalPoemEmpty.hidden = Boolean(poem.trim());
        modalPoemPanel.hidden = false;
        modalPoemPanel.scrollTop = 0;
      } else {
        renderPhotoGrid(branch);
        modalPhotoGrid.classList.add('active');
      }
    }

    function openGallery(branch) {
      const isIntroduction = branch.portal_type === 'introduction';
      introductionTrigger = isIntroduction ? document.activeElement : null;
      galleryModal.classList.toggle('poem-mode', isIntroduction);
      modalPoemPanel.hidden = true;
      modalPhotoGrid.classList.remove('active');
      if (isIntroduction) {
        const poemColor = themeColors[branch.theme] || themeColors.nocturnal;
        galleryModal.style.setProperty('--poem-border', poemColor);
        galleryModal.style.setProperty('--poem-glow', `${poemColor}33`);
      }
      modalTitle.textContent = branch.title || branch.id;
      modalSubtitle.textContent = branch.subtitle || 'Gallery & Archive';
      lockErrorMsg.textContent = '';
      lockPassInput.value = '';

      const requiredPassword = (branch.password || '').trim().toLowerCase();

      if (requiredPassword) {
        lockScreen.classList.add('active');
        modalPhotoGrid.classList.remove('active');

        const attemptUnlock = () => {
          const userEntered = lockPassInput.value.trim().toLowerCase();
          if (userEntered === requiredPassword) {
            lockScreen.classList.remove('active');
            showPortalContent(branch);
          } else {
            lockErrorMsg.textContent = 'Incorrect keyword. The door remains sealed.';
            lockPassInput.value = '';
            lockPassInput.focus();
          }
        };

        lockSubmitBtn.onclick = attemptUnlock;
        lockPassInput.onkeydown = (e) => {
          if (e.key === 'Enter') attemptUnlock();
        };
        setTimeout(() => lockPassInput.focus(), 100);
      } else {
        lockScreen.classList.remove('active');
        showPortalContent(branch);
      }

      galleryModal.classList.add('active');
      if (isIntroduction && !requiredPassword) closeModalBtn.focus();
    }

    function closeGallery() {
      galleryModal.classList.remove('active');
      if (introductionTrigger && introductionTrigger.isConnected) introductionTrigger.focus();
      introductionTrigger = null;
    }

    closeModalBtn.addEventListener('click', closeGallery);
    galleryModal.addEventListener('click', (e) => {
      if (e.target === galleryModal) closeGallery();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && galleryModal.classList.contains('active') && galleryModal.classList.contains('poem-mode')) {
        const controls = [...galleryModal.querySelectorAll('button, input, [tabindex="0"]')]
          .filter(el => !el.disabled && el.getClientRects().length > 0);
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('active')) {
          lightbox.classList.remove('active');
          lightboxImg.src = '';
        } else {
          closeGallery();
        }
      }
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    });

    function buildSlices(branches) {
      const slicesMap = new Map();
      const introductions = branches.filter(b => b.portal_type === 'introduction');
      if (introductions.length) {
        slicesMap.set(LANDING_SLICE, {
          name: LANDING_SLICE,
          bg: introductions[0].slice_bg || 'cosmos',
          items: introductions,
          isLanding: true
        });
      }
      branches.filter(b => b.portal_type !== 'introduction').forEach((b) => {
        const sName = b.slice || 'Prime Cosmos';
        if (!slicesMap.has(sName)) {
          slicesMap.set(sName, { name: sName, bg: b.slice_bg || 'cosmos', items: [] });
        }
        slicesMap.get(sName).items.push(b);
      });
      const priority = slice => slice.isLanding ? 0 : slice.name === 'Prime Cosmos' ? 1 : 2;
      return Array.from(slicesMap.values()).sort((a, b) => priority(a) - priority(b));
    }

    function createIntroductionNode(branch, theme) {
      const node = document.createElement('button');
      node.type = 'button';
      node.className = `portal-node introduction-node theme-${theme}`;
      node.setAttribute('aria-label', `Enter ${branch.title || branch.id}'s portal`);
      node.setAttribute('aria-haspopup', 'dialog');
      node.dataset.person = branch.id;
      const ring = document.createElement('span');
      ring.className = 'portal-ring';
      if (branch.thumbnail) {
        const portrait = document.createElement('img');
        portrait.className = 'portal-thumb';
        portrait.src = branch.thumbnail;
        portrait.alt = '';
        ring.appendChild(portrait);
      } else {
        const sigil = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        sigil.setAttribute('viewBox', '0 0 100 100');
        sigil.setAttribute('class', 'introduction-sigil');
        sigil.setAttribute('aria-hidden', 'true');
        sigil.innerHTML = branch.id === 'introduction-janice'
          ? '<g fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"><circle cx="50" cy="50" r="43"/><ellipse cx="50" cy="50" rx="39" ry="18"/><ellipse cx="50" cy="50" rx="39" ry="18" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="39" ry="18" transform="rotate(120 50 50)"/></g>'
          : '<g fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"><circle cx="50" cy="50" r="43"/><path d="M50 7 93 50 50 93 7 50Z M20 20H80V80H20Z"/><circle cx="50" cy="50" r="32" stroke-dasharray="2 4"/></g>';
        const initial = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        initial.setAttribute('x', '50');
        initial.setAttribute('y', '63');
        initial.textContent = Array.from(branch.title || '?')[0];
        sigil.appendChild(initial);
        ring.appendChild(sigil);
      }
      const label = document.createElement('span');
      label.className = 'portal-label';
      const title = document.createElement('span');
      title.className = 'portal-title';
      title.textContent = branch.title || branch.id;
      const subtitle = document.createElement('span');
      subtitle.className = 'portal-subtitle';
      subtitle.textContent = branch.subtitle || 'An introduction in verse';
      label.append(title, subtitle);
      node.append(ring, label);
      return node;
    }

    async function loadPortals() {
      try {
        const res = await fetch(`branches.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Could not load branches.json');
        const branches = await res.json();

        disksContainer.innerHTML = '';

        // The two introductions open first; the archive disks retain their order.
        sliceList = buildSlices(branches);
        if (sliceList.length === 0) return;

        sliceList.forEach((sliceObj, sIdx) => {
          const diskPlane = document.createElement('div');
          diskPlane.className = 'disk-plane';
          diskPlane.classList.toggle('landing-disk', Boolean(sliceObj.isLanding));

          const halo = document.createElement('div');
          halo.className = 'disk-halo-ring';
          diskPlane.appendChild(halo);

          const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svgEl.setAttribute('class', 'ligaments-svg');
          svgEl.setAttribute('viewBox', '0 0 1000 1000');
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');

          const ligamentsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          svgEl.appendChild(ligamentsGroup);
          diskPlane.appendChild(svgEl);

          // Render portals belonging to this 3D Disk
          sliceObj.items.forEach((branch, idx) => {
            const angleDeg = branch.angle ?? (idx * 60);
            const distance = branch.distance ?? 340;
            const angleRad = (angleDeg * Math.PI) / 180;

            const x = CENTER_X + Math.cos(angleRad) * distance;
            const y = CENTER_Y + Math.sin(angleRad) * distance;

            const theme = themeColors[branch.theme] ? branch.theme : 'nocturnal';
            const filamentStyle = branch.filament || 'standard';

            renderFilament(ligamentsGroup, x, y, idx, theme, filamentStyle);

            const isIntroduction = branch.portal_type === 'introduction';
            const node = isIntroduction ? createIntroductionNode(branch, theme) : document.createElement('div');
            if (!isIntroduction) node.className = `portal-node theme-${theme}`;
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;

            const thumbSrc = branch.thumbnail || (branch.grid_thumbs && branch.grid_thumbs[0]) || (branch.photos && branch.photos[0]) || '';

            if (!isIntroduction) node.innerHTML = `
              <div class="portal-ring">
                <img class="portal-thumb" src="${thumbSrc}" alt="${branch.title || branch.id}" decoding="async" />
              </div>
              <div class="portal-label">
                <div class="portal-title">${branch.title || branch.id}</div>
                <div class="portal-subtitle">${branch.subtitle || ''}</div>
              </div>
            `;

            node.addEventListener('click', () => openGallery(branch));
            diskPlane.appendChild(node);
          });

          // If multiple slices exist, render the outlying Dimensional Shift Portal & Long Wormhole Conduit
          if (sliceList.length > 1) {
            const nextSliceIdx = (sIdx + 1) % sliceList.length;
            const nextSlice = sliceList[nextSliceIdx];

            // Read custom bridge_angle and bridge_distance from the disk's portals (or fallback to auto)
            const customAngle = sliceObj.items.find(b => b.bridge_angle !== undefined && b.bridge_angle !== null && b.bridge_angle !== '')?.bridge_angle;
            const customDist = sliceObj.items.find(b => b.bridge_distance !== undefined && b.bridge_distance !== null && b.bridge_distance !== '')?.bridge_distance;

            const bridgeAngleDeg = (customAngle !== undefined && !isNaN(parseFloat(customAngle)))
              ? parseFloat(customAngle)
              : chooseBridgeAngle(sliceObj.items);
            const bridgeDist = (customDist !== undefined && !isNaN(parseFloat(customDist)))
              ? parseFloat(customDist)
              : 455;
            const bridgeRad = (bridgeAngleDeg * Math.PI) / 180;
            const bx = CENTER_X + Math.cos(bridgeRad) * bridgeDist;
            const by = CENTER_Y + Math.sin(bridgeRad) * bridgeDist;

            const bridgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            bridgeGroup.setAttribute('class', 'bridge-filament-group');

            // 1. Soft Outer Wormhole Aura
            const auraPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const coreRiftD = buildDimensionalRiftPath(CENTER_X, CENTER_Y, bx, by, 1, 0, 1);
            auraPath.setAttribute('d', coreRiftD);
            auraPath.setAttribute('class', 'bridge-outer-aura');
            bridgeGroup.appendChild(auraPath);

            // 2. Sweeping S-Curve Dimensional Spine
            const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            corePath.setAttribute('d', coreRiftD);
            corePath.setAttribute('class', 'bridge-core-path');
            bridgeGroup.appendChild(corePath);

            // 3. High-Frequency Braided Phase-Wave Filaments
            const helixA = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            helixA.setAttribute('d', buildDimensionalRiftPath(CENTER_X, CENTER_Y, bx, by, 5, 16, 1));
            helixA.setAttribute('class', 'bridge-helix-path');
            bridgeGroup.appendChild(helixA);

            const helixB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            helixB.setAttribute('d', buildDimensionalRiftPath(CENTER_X, CENTER_Y, bx, by, 5, 16, -1));
            helixB.setAttribute('class', 'bridge-helix-secondary');
            bridgeGroup.appendChild(helixB);

            // 4. High-Speed Traveling Warp Surge Packet
            const surgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            surgePath.setAttribute('d', coreRiftD);
            surgePath.setAttribute('class', 'bridge-warp-surge');
            bridgeGroup.appendChild(surgePath);

            // 5. Spacetime Aperture Rings along the Conduit
            const dx = bx - CENTER_X;
            const dy = by - CENTER_Y;
            const len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;
            const gateSteps = [0.28, 0.44, 0.60, 0.76, 0.88];

            gateSteps.forEach((t, gIdx) => {
              const archOffset = Math.sin(t * Math.PI * 2) * 24;
              const gx = CENTER_X + dx * t + nx * archOffset;
              const gy = CENTER_Y + dy * t + ny * archOffset;
              const gateRing = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
              const rx = 6 + gIdx * 1.8;
              const ry = 14 + gIdx * 3.2;
              gateRing.setAttribute('cx', gx.toFixed(1));
              gateRing.setAttribute('cy', gy.toFixed(1));
              gateRing.setAttribute('rx', rx.toFixed(1));
              gateRing.setAttribute('ry', ry.toFixed(1));
              gateRing.setAttribute('transform', `rotate(${bridgeAngleDeg} ${gx.toFixed(1)} ${gy.toFixed(1)})`);
              gateRing.setAttribute('class', 'bridge-portal-gate');
              gateRing.style.animationDelay = `${(gIdx * 0.25).toFixed(2)}s`;
              bridgeGroup.appendChild(gateRing);
            });

            bridgeGroup.addEventListener('click', () => switchToSlice(nextSliceIdx));
            ligamentsGroup.appendChild(bridgeGroup);

            const bridgeNode = document.createElement('div');
            bridgeNode.className = 'bridge-node';
            bridgeNode.style.left = `${bx}px`;
            bridgeNode.style.top = `${by}px`;
            bridgeNode.innerHTML = `
              <div class="bridge-sigil-ring">
                <svg class="bridge-sigil-svg" viewBox="0 0 64 64">
                  <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="4 3"/>
                  <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="#ffffff" stroke-width="1.1" transform="rotate(35 32 32)" opacity="0.8"/>
                  <ellipse cx="32" cy="32" rx="26" ry="11" fill="none" stroke="#ffffff" stroke-width="1.1" transform="rotate(-35 32 32)" opacity="0.8"/>
                  <polygon points="32,9 52,45 12,45" fill="none" stroke="currentColor" stroke-width="1.6"/>
                  <polygon points="32,55 52,19 12,19" fill="none" stroke="currentColor" stroke-width="1.6"/>
                  <circle cx="32" cy="32" r="5.5" fill="#ffffff"/>
                </svg>
              </div>
              <div class="bridge-label">
                <div class="bridge-title">Dimensional Shift</div>
                <div class="bridge-sub">Warp to: ${nextSlice.name}</div>
              </div>
            `;
            bridgeNode.addEventListener('click', () => switchToSlice(nextSliceIdx));
            diskPlane.appendChild(bridgeNode);
          }

          disksContainer.appendChild(diskPlane);
        });

        switchToSlice(0);
      } catch (err) {
        console.error('Error initializing portal network:', err);
      }
    }

    loadPortals();
  </script>
</body>
</html>
