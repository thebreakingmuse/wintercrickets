  </div>

  <!-- Hidden Sanctum Sigil Link to Portal Studio (/admin/) -->
  <a href="/admin/" class="sanctum-sigil-link" title="Portal Studio" aria-label="Enter Portal Studio">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="32" cy="32" r="28" stroke-dasharray="3 3" opacity="0.7" />
      <polygon points="32,7 51,48 13,48" opacity="0.85" />
      <polygon points="32,57 51,16 13,16" opacity="0.85" />
      <circle cx="32" cy="32" r="7.5" />
      <circle cx="32" cy="32" r="2.2" fill="currentColor" />
    </svg>
  </a>

  <script>
    const CENTER_X = 500;
    const CENTER_Y = 500;
    const LANDING_SLICE = 'Janice & Paul';

    const themeColors = {
      nocturnal: '#b366ff',
      cyber: '#00f0ff',
      celestial: '#ffd166',
      oceanic: '#00f5d4',
      rose: '#ff4d79'
    };

    const FALLBACK_BRANCHES = [
      {
        id: 'introduction-janice',
        title: 'Janice',
        portal_type: 'introduction',
        theme: 'nocturnal',
        filament: 'vine',
        angle: 180,
        distance: 290,
        slice_bg: 'cosmos'
      },
      {
        id: 'introduction-paul',
        title: 'Paul',
        portal_type: 'introduction',
        theme: 'celestial',
        filament: 'gothic',
        angle: 0,
        distance: 290,
        slice_bg: 'cosmos'
      }
    ];

    const CRICKET_SVG_MARKUP = `
      <path class="cricket-antenna ant-l" d="M29 15 C24 6, 13 2, 4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <path class="cricket-antenna ant-r" d="M35 15 C40 6, 51 2, 60 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

      <path class="cricket-leg leg-fl gait-a" d="M28 21 L17 15 L12 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="cricket-leg leg-fr gait-b" d="M36 21 L47 15 L52 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <path class="cricket-leg leg-ml gait-b" d="M27 28 L14 26 L9 33" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="cricket-leg leg-mr gait-a" d="M37 28 L50 26 L55 33" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

      <g class="cricket-leg leg-hl gait-a">
        <path d="M28 35 C20 31, 13 23, 11 25 C9 27, 15 37, 23 41 L14 55 L10 58" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="cricket-leg leg-hr gait-b">
        <path d="M36 35 C44 31, 51 23, 53 25 C55 27, 49 37, 41 41 L50 55 L54 58" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g class="cricket-body">
        <path d="M29 50 L23 60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M35 50 L41 60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>

        <ellipse cx="32" cy="17" rx="4.2" ry="3.6" fill="currentColor"/>
        <circle cx="28.2" cy="16" r="1.3" fill="#fff3b0"/>
        <circle cx="35.8" cy="16" r="1.3" fill="#fff3b0"/>

        <rect x="27" y="20.5" width="10" height="7.5" rx="2.8" fill="currentColor" stroke="#080612" stroke-width="0.9"/>

        <ellipse cx="32" cy="39" rx="5.6" ry="12.5" fill="currentColor" stroke="#080612" stroke-width="0.9"/>
        <path d="M32 28 L32 50 M28.5 31 L35.5 35 M35.5 31 L28.5 35 M28.5 37 L35.5 41 M35.5 37 L28.5 41 M29 43 L35 46" fill="none" stroke="#080612" stroke-width="0.9" stroke-linecap="round"/>
      </g>
    `;

    document.querySelectorAll('.cricket-icon').forEach((svgEl, idx) => {
      svgEl.innerHTML = CRICKET_SVG_MARKUP;
      const delay = -(idx * 0.19).toFixed(2) + 's';
      svgEl.querySelectorAll('.cricket-leg, .cricket-body, .cricket-antenna').forEach((part) => {
        part.style.animationDelay = delay;
      });
    });

    const disksContainer = document.getElementById('disks-container');
    const activeSliceBadge = document.getElementById('active-slice-badge');
    const galleryModal = document.getElementById('gallery-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalPhotoGrid = document.getElementById('modal-photo-grid');
    const modalPoemPanel = document.getElementById('modal-poem-panel');
    const modalPoemTitle = document.getElementById('modal-poem-title');
    let modalPoemText = document.getElementById('modal-poem-text');
    const modalPoemEmpty = document.getElementById('modal-poem-empty');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lockScreen = document.getElementById('lock-screen');
    const lockPassInput = document.getElementById('lock-pass-input');
    const lockSubmitBtn = document.getElementById('lock-submit-btn');
    const lockErrorMsg = document.getElementById('lock-error-msg');

    let sliceList = [];
    let currentSliceIndex = 0;
    let introductionTrigger = null;
    let selectionAccentTimer = null;

    function buildCurvedPath(x1, y1, x2, y2, index, bendFactor = 0.18) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      const dx = x2 - x1;
      const dy = y2 - y1;
      const offsetDirection = index % 2 === 0 ? 1 : -1;
      const ctrlX = midX - dy * bendFactor * offsetDirection;
      const ctrlY = midY + dx * bendFactor * offsetDirection;
      return `M ${x1} ${y1} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`;
    }

    function buildWavePath(x1, y1, x2, y2, phase = 1) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const c1x = x1 + dx * 0.33 - dy * 0.14 * phase;
      const c1y = y1 + dy * 0.33 + dx * 0.14 * phase;
      const c2x = x1 + dx * 0.66 + dy * 0.14 * phase;
      const c2y = y1 + dy * 0.66 - dx * 0.14 * phase;
      return `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`;
    }

    function chooseBridgeAngle(sliceItems) {
      const preferredCorners = [-32, -148, 32, 148, -90];
      const usedAngles = sliceItems.map((b, i) => b.angle ?? (i * 60));
      for (const candidate of preferredCorners) {
        const isClear = usedAngles.every((a) => Math.abs(((candidate - a + 540) % 360) - 180) >= 26);
        if (isClear) return candidate;
      }
      return -32;
    }

    function renderFilament(svgGroup, x2, y2, idx, theme, filamentStyle) {
      const color = themeColors[theme] || themeColors.nocturnal;
      if (window.DOSFilaments.render(svgGroup, CENTER_X, CENTER_Y, x2, y2, filamentStyle, color)) return;

      if (filamentStyle === 'vine') {
        const mainVine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        mainVine.setAttribute('d', buildWavePath(CENTER_X, CENTER_Y, x2, y2, 1));
        mainVine.setAttribute('class', 'ligament-vine-main');
        mainVine.setAttribute('stroke', `url(#grad-${theme})`);
        mainVine.style.color = color;
        svgGroup.appendChild(mainVine);

        const offTendril = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        offTendril.setAttribute('d', buildWavePath(CENTER_X, CENTER_Y, x2, y2, -0.85));
        offTendril.setAttribute('class', 'ligament-vine-tendril');
        offTendril.setAttribute('stroke', color);
        offTendril.style.color = color;
        svgGroup.appendChild(offTendril);

      } else if (filamentStyle === 'tendril') {
        const strandA = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strandA.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx, 0.22));
        strandA.setAttribute('class', 'ligament-path');
        strandA.setAttribute('stroke', `url(#grad-${theme})`);
        strandA.style.color = color;
        svgGroup.appendChild(strandA);

        const strandB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strandB.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx + 1, 0.16));
        strandB.setAttribute('class', 'ligament-vine-tendril');
        strandB.setAttribute('stroke', color);
        strandB.style.color = color;
        svgGroup.appendChild(strandB);

      } else if (filamentStyle === 'suspension') {
        const midX = (CENTER_X + x2) / 2;
        const midY = (CENTER_Y + y2) / 2;
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const dir = idx % 2 === 0 ? 1 : -1;
        const ctrlX = midX - dy * 0.24 * dir;
        const ctrlY = midY + dx * 0.24 * dir;

        let strutsD = '';
        const steps = [0.22, 0.32, 0.42, 0.52, 0.62, 0.72, 0.82];
        steps.forEach((t) => {
          const inv = 1 - t;
          const lx = inv * CENTER_X + t * x2;
          const ly = inv * CENTER_Y + t * y2;
          const cx = inv * inv * CENTER_X + 2 * inv * t * ctrlX + t * t * x2;
          const cy = inv * inv * CENTER_Y + 2 * inv * t * ctrlY + t * t * y2;
          strutsD += `M ${lx.toFixed(1)} ${ly.toFixed(1)} L ${cx.toFixed(1)} ${cy.toFixed(1)} `;
        });

        const strutsPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        strutsPath.setAttribute('d', strutsD.trim());
        strutsPath.setAttribute('class', 'ligament-suspension-struts');
        strutsPath.setAttribute('stroke', color);
        svgGroup.appendChild(strutsPath);

        const deckPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        deckPath.setAttribute('d', `M ${CENTER_X} ${CENTER_Y} L ${x2} ${y2}`);
        deckPath.setAttribute('class', 'ligament-suspension-deck');
        deckPath.setAttribute('stroke', `url(#grad-${theme})`);
        deckPath.style.color = color;
        svgGroup.appendChild(deckPath);

        const cablePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        cablePath.setAttribute('d', `M ${CENTER_X} ${CENTER_Y} Q ${ctrlX} ${ctrlY} ${x2} ${y2}`);
        cablePath.setAttribute('class', 'ligament-suspension-cable');
        cablePath.setAttribute('stroke', color);
        cablePath.style.color = color;
        svgGroup.appendChild(cablePath);

      } else if (filamentStyle === 'grid') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = idx % 2 === 0 ? 1 : -1;
        const nx = (-dy / len) * dir;
        const ny = (dx / len) * dir;
        const offset = 26;

        const p1x = CENTER_X + dx * 0.34 + nx * offset;
        const p1y = CENTER_Y + dy * 0.34 + ny * offset;
        const p2x = CENTER_X + dx * 0.68 + nx * offset;
        const p2y = CENTER_Y + dy * 0.68 + ny * offset;
        const mainD = `M ${CENTER_X} ${CENTER_Y} L ${p1x.toFixed(1)} ${p1y.toFixed(1)} L ${p2x.toFixed(1)} ${p2y.toFixed(1)} L ${x2} ${y2}`;

        const subOffset = offset - 9;
        const s1x = CENTER_X + dx * 0.34 + nx * subOffset;
        const s1y = CENTER_Y + dy * 0.34 + ny * subOffset;
        const s2x = CENTER_X + dx * 0.68 + nx * subOffset;
        const s2y = CENTER_Y + dy * 0.68 + ny * subOffset;
        const subD = `M ${CENTER_X} ${CENTER_Y} L ${s1x.toFixed(1)} ${s1y.toFixed(1)} L ${s2x.toFixed(1)} ${s2y.toFixed(1)} L ${x2} ${y2}`;

        const subRail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        subRail.setAttribute('d', subD);
        subRail.setAttribute('class', 'ligament-grid-subrail');
        subRail.setAttribute('stroke', color);
        svgGroup.appendChild(subRail);

        const mainRail = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        mainRail.setAttribute('d', mainD);
        mainRail.setAttribute('class', 'ligament-grid-rail');
        mainRail.setAttribute('stroke', `url(#grad-${theme})`);
        mainRail.style.color = color;
        svgGroup.appendChild(mainRail);

        const surgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        surgePath.setAttribute('d', mainD);
        surgePath.setAttribute('class', 'ligament-grid-surge');
        surgePath.style.color = color;
        svgGroup.appendChild(surgePath);

        [[p1x, p1y], [p2x, p2y]].forEach(([jx, jy]) => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', jx.toFixed(1));
          dot.setAttribute('cy', jy.toFixed(1));
          dot.setAttribute('r', '3.4');
          dot.setAttribute('class', 'ligament-grid-station');
          dot.setAttribute('stroke', color);
          dot.style.color = color;
          svgGroup.appendChild(dot);
        });

      } else if (filamentStyle === 'gothic') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = idx % 2 === 0 ? 1 : -1;
        const nx = (-dy / len) * dir;
        const ny = (dx / len) * dir;

        const peakX = CENTER_X + dx * 0.5 + nx * 28;
        const peakY = CENTER_Y + dy * 0.5 + ny * 28;
        const c1x = CENTER_X + dx * 0.22 + nx * 22;
        const c1y = CENTER_Y + dy * 0.22 + ny * 22;
        const c2x = CENTER_X + dx * 0.78 + nx * 22;
        const c2y = CENTER_Y + dy * 0.78 + ny * 22;
        const lancetD = `M ${CENTER_X} ${CENTER_Y} Q ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${peakX.toFixed(1)} ${peakY.toFixed(1)} Q ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${x2} ${y2}`;

        const counterPeakX = CENTER_X + dx * 0.5 - nx * 16;
        const counterPeakY = CENTER_Y + dy * 0.5 - ny * 16;
        const cc1x = CENTER_X + dx * 0.25 - nx * 12;
        const cc1y = CENTER_Y + dy * 0.25 - ny * 12;
        const cc2x = CENTER_X + dx * 0.75 - nx * 12;
        const cc2y = CENTER_Y + dy * 0.75 - ny * 12;
        const traceryD = `M ${CENTER_X} ${CENTER_Y} Q ${cc1x.toFixed(1)} ${cc1y.toFixed(1)} ${counterPeakX.toFixed(1)} ${counterPeakY.toFixed(1)} Q ${cc2x.toFixed(1)} ${cc2y.toFixed(1)} ${x2} ${y2}`;

        let thornsD = '';
        const thornSteps = [0.22, 0.36, 0.5, 0.64, 0.78];
        thornSteps.forEach((t, tIdx) => {
          const bx = CENTER_X + dx * t;
          const by = CENTER_Y + dy * t;
          const spikeLen = t === 0.5 ? 24 : (tIdx % 2 === 0 ? 15 : 19);
          const s1x = bx + nx * spikeLen;
          const s1y = by + ny * spikeLen;
          const s2x = bx - nx * (spikeLen * 0.75);
          const s2y = by - ny * (spikeLen * 0.75);
          thornsD += `M ${s2x.toFixed(1)} ${s2y.toFixed(1)} L ${s1x.toFixed(1)} ${s1y.toFixed(1)} `;
        });

        const thornsPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        thornsPath.setAttribute('d', thornsD.trim());
        thornsPath.setAttribute('class', 'ligament-gothic-thorns');
        thornsPath.setAttribute('stroke', color);
        thornsPath.style.color = color;
        svgGroup.appendChild(thornsPath);

        const traceryPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        traceryPath.setAttribute('d', traceryD);
        traceryPath.setAttribute('class', 'ligament-gothic-tracery');
        traceryPath.setAttribute('stroke', color);
        traceryPath.style.color = color;
        svgGroup.appendChild(traceryPath);

        const spinePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        spinePath.setAttribute('d', lancetD);
        spinePath.setAttribute('class', 'ligament-gothic-spine');
        spinePath.setAttribute('stroke', `url(#grad-${theme})`);
        spinePath.style.color = color;
        svgGroup.appendChild(spinePath);

        [0.36, 0.5, 0.64].forEach((t) => {
          const fx = CENTER_X + dx * t;
          const fy = CENTER_Y + dy * t;
          const size = t === 0.5 ? 5.5 : 4;
          const diamond = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const pTop = `${(fx + nx * size).toFixed(1)},${(fy + ny * size).toFixed(1)}`;
          const pRight = `${(fx + (dx / len) * size).toFixed(1)},${(fy + (dy / len) * size).toFixed(1)}`;
          const pBot = `${(fx - nx * size).toFixed(1)},${(fy - ny * size).toFixed(1)}`;
          const pLeft = `${(fx - (dx / len) * size).toFixed(1)},${(fy - (dy / len) * size).toFixed(1)}`;
          diamond.setAttribute('points', `${pTop} ${pRight} ${pBot} ${pLeft}`);
          diamond.setAttribute('class', 'ligament-gothic-finial');
          diamond.setAttribute('stroke', color);
          diamond.style.color = color;
          svgGroup.appendChild(diamond);
        });

      } else if (filamentStyle === 'alchemical') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        const steps = 48;
        const waves = 3;
        const amp = 18;

        let dSerpentA = `M ${CENTER_X} ${CENTER_Y}`;
        let dSerpentB = `M ${CENTER_X} ${CENTER_Y}`;

        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const env = Math.sin(t * Math.PI);
          const wave = Math.sin(t * Math.PI * waves) * amp * env;
          const ax = CENTER_X + dx * t + nx * wave;
          const ay = CENTER_Y + dy * t + ny * wave;
          const bx = CENTER_X + dx * t - nx * wave;
          const by = CENTER_Y + dy * t - ny * wave;
          dSerpentA += ` L ${ax.toFixed(1)} ${ay.toFixed(1)}`;
          dSerpentB += ` L ${bx.toFixed(1)} ${by.toFixed(1)}`;
        }

        const staffPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        staffPath.setAttribute('d', `M ${CENTER_X} ${CENTER_Y} L ${x2} ${y2}`);
        staffPath.setAttribute('class', 'ligament-alchemical-staff');
        staffPath.setAttribute('stroke', color);
        svgGroup.appendChild(staffPath);

        const serpentB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        serpentB.setAttribute('d', dSerpentB);
        serpentB.setAttribute('class', 'ligament-alchemical-counter');
        serpentB.setAttribute('stroke', color);
        serpentB.style.color = color;
        svgGroup.appendChild(serpentB);

        const serpentA = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        serpentA.setAttribute('d', dSerpentA);
        serpentA.setAttribute('class', 'ligament-alchemical-serpent');
        serpentA.setAttribute('stroke', `url(#grad-${theme})`);
        serpentA.style.color = color;
        svgGroup.appendChild(serpentA);

        [1 / 3, 0.5, 2 / 3].forEach((t, nIdx) => {
          const cx = CENTER_X + dx * t;
          const cy = CENTER_Y + dy * t;
          const isCenter = nIdx === 1;

          const outerRing = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          outerRing.setAttribute('cx', cx.toFixed(1));
          outerRing.setAttribute('cy', cy.toFixed(1));
          outerRing.setAttribute('r', isCenter ? '7.5' : '4.5');
          outerRing.setAttribute('class', 'ligament-alchemical-node');
          outerRing.setAttribute('stroke', color);
          outerRing.style.color = color;
          svgGroup.appendChild(outerRing);

          if (isCenter) {
            const sunDot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            sunDot.setAttribute('cx', cx.toFixed(1));
            sunDot.setAttribute('cy', cy.toFixed(1));
            sunDot.setAttribute('r', '2.2');
            sunDot.setAttribute('fill', '#ffffff');
            svgGroup.appendChild(sunDot);
          }
        });

      } else if (filamentStyle === 'mycelium') {
        const dx = x2 - CENTER_X;
        const dy = y2 - CENTER_Y;
        const len = Math.hypot(dx, dy) || 1;
        const dir = idx % 2 === 0 ? 1 : -1;
        const nx = (-dy / len) * dir;
        const ny = (dx / len) * dir;

        const p1 = { x: CENTER_X + dx * 0.24 + nx * 16, y: CENTER_Y + dy * 0.24 + ny * 16 };
        const p2 = { x: CENTER_X + dx * 0.50 - nx * 12, y: CENTER_Y + dy * 0.50 - ny * 12 };
        const p3 = { x: CENTER_X + dx * 0.76 + nx * 18, y: CENTER_Y + dy * 0.76 + ny * 18 };

        const mainD = `M ${CENTER_X} ${CENTER_Y} Q ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} T ${p3.x.toFixed(1)} ${p3.y.toFixed(1)} L ${x2} ${y2}`;

        const b1 = { x: CENTER_X + dx * 0.36 - nx * 24, y: CENTER_Y + dy * 0.36 - ny * 24 };
        const b2 = { x: CENTER_X + dx * 0.66 + nx * 26, y: CENTER_Y + dy * 0.66 + ny * 26 };
        const s1 = { x: p1.x + nx * 16 + (dx / len) * 14, y: p1.y + ny * 16 + (dy / len) * 14 };
        const s2 = { x: b1.x - nx * 12 + (dx / len) * 16, y: b1.y - ny * 12 + (dy / len) * 16 };
        const s3 = { x: b2.x + nx * 14 + (dx / len) * 12, y: b2.y + ny * 14 + (dy / len) * 12 };

        const webD = [
          `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} Q ${b1.x.toFixed(1)} ${b1.y.toFixed(1)} ${p3.x.toFixed(1)} ${p3.y.toFixed(1)}`,
          `M ${p2.x.toFixed(1)} ${p2.y.toFixed(1)} Q ${b2.x.toFixed(1)} ${b2.y.toFixed(1)} ${x2} ${y2}`,
          `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} L ${s1.x.toFixed(1)} ${s1.y.toFixed(1)}`,
          `M ${b1.x.toFixed(1)} ${b1.y.toFixed(1)} L ${s2.x.toFixed(1)} ${s2.y.toFixed(1)}`,
          `M ${b2.x.toFixed(1)} ${b2.y.toFixed(1)} L ${s3.x.toFixed(1)} ${s3.y.toFixed(1)}`
        ].join(' ');

        const webPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        webPath.setAttribute('d', webD);
        webPath.setAttribute('class', 'ligament-mycelium-hyphae');
        webPath.setAttribute('stroke', color);
        webPath.style.color = color;
        svgGroup.appendChild(webPath);

        const mainPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        mainPath.setAttribute('d', mainD);
        mainPath.setAttribute('class', 'ligament-mycelium-primary');
        mainPath.setAttribute('stroke', `url(#grad-${theme})`);
        mainPath.style.color = color;
        svgGroup.appendChild(mainPath);

        [s1, s2, s3, p2].forEach((pt, sIdx) => {
          const spore = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          spore.setAttribute('cx', pt.x.toFixed(1));
          spore.setAttribute('cy', pt.y.toFixed(1));
          spore.setAttribute('r', sIdx === 3 ? '3.4' : '2.6');
          spore.setAttribute('class', 'ligament-mycelium-spore');
          spore.setAttribute('stroke', color);
          spore.style.color = color;
          spore.style.animationDelay = `${(sIdx * 0.45).toFixed(2)}s`;
          svgGroup.appendChild(spore);
        });

      } else {
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', buildCurvedPath(CENTER_X, CENTER_Y, x2, y2, idx));
        path.setAttribute('class', 'ligament-path');
        path.setAttribute('stroke', `url(#grad-${theme})`);
        path.style.color = color;
        svgGroup.appendChild(path);
      }
    }

    function applyRealmAesthetic(realmId, sliceName) {
      const validRealms = ['cosmos', 'verdant', 'ember', 'abyss', 'astral', 'nyc', 'wilderness', 'noir', 'cybernetic', 'music'];
      const targetRealm = validRealms.includes(realmId) ? realmId : 'cosmos';

      document.body.setAttribute('data-realm', targetRealm);

      document.querySelectorAll('.realm-layer').forEach((layer) => {
        if (layer.getAttribute('data-realm-id') === targetRealm) {
          layer.classList.add('active');
        } else {
          layer.classList.remove('active');
        }
      });

      if (sliceList.length > 1) {
        activeSliceBadge.style.display = 'inline-block';
        activeSliceBadge.textContent = `Active Disk: ${sliceName}`;
      }
    }

    function switchToSlice(targetIndex) {
      currentSliceIndex = targetIndex;
      const activeSlice = sliceList[currentSliceIndex];
      applyRealmAesthetic(activeSlice.bg, activeSlice.name);
      document.body.classList.toggle('landing-disc-active', Boolean(activeSlice.isLanding));

      const diskEls = document.querySelectorAll('.disk-plane');
      diskEls.forEach((el, idx) => {
        el.inert = idx !== currentSliceIndex;
        el.setAttribute('aria-hidden', idx === currentSliceIndex ? 'false' : 'true');
        el.classList.remove('active-disk', 'inactive-disk-above', 'inactive-disk-below');
        if (idx === currentSliceIndex) {
          el.classList.add('active-disk');
        } else if (idx < currentSliceIndex) {
          el.classList.add('inactive-disk-above');
        } else {
          el.classList.add('inactive-disk-below');
        }
      });
    }

    function renderPhotoGrid(branch) {
      modalPhotoGrid.innerHTML = '';
      const photos = branch.photos || [];
      const thumbs = branch.grid_thumbs || [];

      photos.forEach((fullPhotoPath, idx) => {
        const previewPath = thumbs[idx] || fullPhotoPath;

        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = previewPath;
        img.alt = branch.title || 'Portal image';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.addEventListener('load', () => img.classList.add('loaded'));

        img.addEventListener('error', () => {
          if (img.src !== fullPhotoPath) img.src = fullPhotoPath;
        });

        card.appendChild(img);

        card.addEventListener('click', () => {
          lightboxImg.src = fullPhotoPath;
          lightbox.classList.add('active');
        });

        modalPhotoGrid.appendChild(card);
      });
    }

    function showPortalContent(branch) {
      if (branch.portal_type === 'introduction') {
        const poem = typeof branch.poem_text === 'string' ? branch.poem_text : '';
        modalPhotoGrid.classList.remove('active');
        modalPoemTitle.textContent = branch.poem_title || '';
        modalPoemTitle.hidden = !branch.poem_title;
        const verse = document.createElement('div');
        verse.className = 'poem-text emerging';
        verse.id = 'modal-poem-text';
        verse.style.fontStyle = branch.poem_italic ? 'italic' : 'normal';
        verse.textContent = poem;
        modalPoemText.replaceWith(verse);
        modalPoemText = verse;
        modalPoemEmpty.hidden = Boolean(poem.trim());
        modalPoemPanel.hidden = false;
        modalPoemPanel.scrollTop = 0;
      } else {
        renderPhotoGrid(branch);
        modalPhotoGrid.classList.add('active');
      }
    }

    function openGallery(branch, triggerEl = null) {
      const isIntroduction = branch.portal_type === 'introduction';
      introductionTrigger = isIntroduction ? (triggerEl || document.activeElement) : null;
      galleryModal.classList.toggle('poem-mode', isIntroduction);
      galleryModal.dataset.poemTheme = isIntroduction ? (branch.id === 'introduction-janice' ? 'natural' : 'cosmic') : '';
      if (isIntroduction) {
        galleryModal.removeAttribute('aria-labelledby');
        galleryModal.setAttribute('aria-label', `${branch.title || branch.id} poem`);
      } else {
        galleryModal.removeAttribute('aria-label');
        galleryModal.setAttribute('aria-labelledby', 'modal-title');
      }
      modalPoemPanel.hidden = true;
      modalPhotoGrid.classList.remove('active');

      clearTimeout(selectionAccentTimer);
      if (isIntroduction) {
        const poemColor = branch.id === 'introduction-janice' ? '#9bcaaa' : '#aabfee';
        galleryModal.style.setProperty('--poem-border', poemColor);
        galleryModal.style.setProperty('--poem-glow', `${poemColor}33`);

        const accentKey = branch.id === 'introduction-janice' ? 'violet' : 'gold';
        galleryModal.setAttribute('data-selection-accent', accentKey);
        selectionAccentTimer = setTimeout(() => {
          galleryModal.removeAttribute('data-selection-accent');
        }, 720);
      } else {
        galleryModal.removeAttribute('data-selection-accent');
      }

      modalTitle.textContent = branch.title || branch.id;
      modalSubtitle.textContent = isIntroduction ? '' : branch.subtitle || 'Gallery & Archive';
      modalSubtitle.hidden = isIntroduction;
      lockErrorMsg.textContent = '';
      lockPassInput.value = '';

      const requiredPassword = (branch.password || '').trim().toLowerCase();

      if (requiredPassword) {
        lockScreen.classList.add('active');
        modalPhotoGrid.classList.remove('active');

        const attemptUnlock = () => {
          const userEntered = lockPassInput.value.trim().toLowerCase();
          if (userEntered === requiredPassword) {
            lockScreen.classList.remove('active');
            showPortalContent(branch);
          } else {
            lockErrorMsg.textContent = 'Incorrect keyword. The door remains sealed.';
            lockPassInput.value = '';
            lockPassInput.focus();
          }
        };

        lockSubmitBtn.onclick = attemptUnlock;
        lockPassInput.onkeydown = (e) => {
          if (e.key === 'Enter') attemptUnlock();
        };
        setTimeout(() => lockPassInput.focus(), 100);
      } else {
        lockScreen.classList.remove('active');
        showPortalContent(branch);
      }

      galleryModal.classList.add('active');
      if (isIntroduction && !requiredPassword) closeModalBtn.focus();
    }

    function closeGallery() {
      clearTimeout(selectionAccentTimer);
      galleryModal.removeAttribute('data-selection-accent');
      galleryModal.classList.remove('active');
      if (introductionTrigger && introductionTrigger.isConnected) introductionTrigger.focus();
      introductionTrigger = null;
    }

    closeModalBtn.addEventListener('click', closeGallery);
    galleryModal.addEventListener('click', (e) => {
      if (e.target === galleryModal) closeGallery();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Tab' && galleryModal.classList.contains('active') && galleryModal.classList.contains('poem-mode')) {
        const controls = [...galleryModal.querySelectorAll('button, input, [tabindex="0"]')]
          .filter(el => !el.disabled && el.getClientRects().length > 0);
        const first = controls[0];
        const last = controls[controls.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }
      if (e.key === 'Escape') {
        if (lightbox.classList.contains('active')) {
          lightbox.classList.remove('active');
          lightboxImg.src = '';
        } else {
          closeGallery();
        }
      }
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    });

    function buildSlices(branches) {
      const slicesMap = new Map();
      const introductions = branches.filter(b => b.portal_type === 'introduction');
      if (introductions.length) {
        slicesMap.set(LANDING_SLICE, {
          name: LANDING_SLICE,
          bg: introductions[0].slice_bg || 'cosmos',
          items: introductions,
          isLanding: true
        });
      }
      branches.filter(b => b.portal_type !== 'introduction').forEach((b) => {
        const sName = b.slice || 'Prime Cosmos';
        if (!slicesMap.has(sName)) {
          slicesMap.set(sName, { name: sName, bg: b.slice_bg || 'cosmos', items: [] });
        }
        slicesMap.get(sName).items.push(b);
      });
      const priority = slice => slice.isLanding ? 0 : slice.name === 'Prime Cosmos' ? 1 : 2;
      return Array.from(slicesMap.values()).sort((a, b) => priority(a) - priority(b));
    }

    function createIntroductionNode(branch, theme, filamentGroup) {
      const person = {
        'introduction-janice': { initial: 'J', name: 'Janice' },
        'introduction-paul': { initial: 'P', name: 'Paul' }
      }[branch.id];
      const node = document.createElement('button');
      node.type = 'button';
      node.className = `portal-node introduction-node theme-${theme}`;
      node.setAttribute('aria-label', `Enter ${person ? person.name : branch.title || branch.id}'s portal`);
      node.setAttribute('aria-haspopup', 'dialog');
      node.dataset.person = branch.id;

      const ring = document.createElement('span');
      ring.className = 'portal-ring';
      const portraits = {
        'introduction-janice': 'assets/janice-avatar.png',
        'introduction-paul': 'assets/paul-avatar.jpg'
      };
      const portraitSrc = portraits[branch.id] || (!person ? branch.thumbnail : '');

      const appendFallbackSigil = () => {
        ring.innerHTML = '';
        const sigil = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        sigil.setAttribute('viewBox', '0 0 100 100');
        sigil.setAttribute('class', 'introduction-sigil');
        sigil.setAttribute('aria-hidden', 'true');
        sigil.innerHTML = branch.id === 'introduction-janice'
          ? '<g fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"><circle cx="50" cy="50" r="43"/><ellipse cx="50" cy="50" rx="39" ry="18"/><ellipse cx="50" cy="50" rx="39" ry="18" transform="rotate(60 50 50)"/><ellipse cx="50" cy="50" rx="39" ry="18" transform="rotate(120 50 50)"/></g>'
          : '<g fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.5"><circle cx="50" cy="50" r="43"/><path d="M50 7 93 50 50 93 7 50Z M20 20H80V80H20Z"/><circle cx="50" cy="50" r="32" stroke-dasharray="2 4"/></g>';
        const initial = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        initial.setAttribute('x', '50');
        initial.setAttribute('y', '63');
        initial.textContent = person ? person.initial : Array.from(branch.title || '?')[0];
        sigil.appendChild(initial);
        ring.appendChild(sigil);
      };

      if (portraitSrc) {
        const portrait = document.createElement('img');
        portrait.className = 'portal-thumb';
        portrait.src = portraitSrc;
        portrait.alt = '';
        portrait.addEventListener('error', appendFallbackSigil, { once: true });
        ring.appendChild(portrait);
      } else {
        appendFallbackSigil();
      }

      const label = document.createElement('span');
      label.className = 'portal-label';
      const title = document.createElement('span');
      title.className = 'portal-title';
      title.textContent = person ? person.name : branch.title || branch.id;

      const flourish = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      flourish.setAttribute('viewBox', '0 0 160 22');
      flourish.setAttribute('class', 'introduction-flourish');
      flourish.setAttribute('aria-hidden', 'true');
      flourish.setAttribute('focusable', 'false');
      flourish.innerHTML = `
        <path d="M 14 4 Q 80 18 146 4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" opacity="0.88" />
        <path d="M 40 9 Q 80 19 120 9" fill="none" stroke="currentColor" stroke-width="0.75" stroke-linecap="round" opacity="0.52" />
        <polygon points="80,7.2 83.2,10.8 80,14.4 76.8,10.8" fill="currentColor" opacity="0.92" />
        <circle cx="26" cy="6.2" r="1.1" fill="currentColor" opacity="0.65" />
        <circle cx="134" cy="6.2" r="1.1" fill="currentColor" opacity="0.65" />
      `;

      label.append(title, flourish);
      node.append(ring, label);

      const setPathIlluminated = (active) => {
        if (filamentGroup) filamentGroup.classList.toggle('is-illuminated', active);
      };

      node.addEventListener('mouseenter', () => setPathIlluminated(true));
      node.addEventListener('mouseleave', () => setPathIlluminated(false));
      node.addEventListener('focus', () => setPathIlluminated(true));
      node.addEventListener('blur', () => setPathIlluminated(false));
      node.addEventListener('touchstart', () => {
        node.classList.add('is-touch-active');
        setPathIlluminated(true);
      }, { passive: true });
      node.addEventListener('touchend', () => {
        setTimeout(() => {
          node.classList.remove('is-touch-active');
          setPathIlluminated(false);
        }, 320);
      }, { passive: true });
      node.addEventListener('touchcancel', () => {
        node.classList.remove('is-touch-active');
        setPathIlluminated(false);
      }, { passive: true });

      return node;
    }

    async function loadPortals() {
      let branches = [];
      try {
        const res = await fetch(`branches.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawText = await res.text();
        const cleanedText = rawText
          .replace(/^<<<<<<<.*$/gm, '')
          .replace(/^=======.*$/gm, '')
          .replace(/^>>>>>>>.*$/gm, '');
        const parsed = JSON.parse(cleanedText);
        branches = Array.isArray(parsed) && parsed.length ? parsed : FALLBACK_BRANCHES;
      } catch (err) {
        console.warn('Using fallback landing portals because branches.json could not be fetched/parsed:', err);
        branches = FALLBACK_BRANCHES;
      }

      try {
        disksContainer.innerHTML = '';

        sliceList = buildSlices(branches);
        if (sliceList.length === 0) {
          sliceList = buildSlices(FALLBACK_BRANCHES);
        }

        sliceList.forEach((sliceObj, sIdx) => {
          const diskPlane = document.createElement('div');
          diskPlane.className = 'disk-plane';
          diskPlane.classList.toggle('landing-disk', Boolean(sliceObj.isLanding));

          const halo = document.createElement('div');
          halo.className = 'disk-halo-ring';
          diskPlane.appendChild(halo);

          const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svgEl.setAttribute('class', 'ligaments-svg');
          svgEl.setAttribute('viewBox', '0 0 1000 1000');
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');

          const ligamentsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          svgEl.appendChild(ligamentsGroup);
          diskPlane.appendChild(svgEl);

          sliceObj.items.forEach((branch, idx) => {
            const angleDeg = branch.angle ?? (idx * 60);
            const distance = branch.distance ?? 340;
            const angleRad = (angleDeg * Math.PI) / 180;

            const x = CENTER_X + Math.cos(angleRad) * distance;
            const y = CENTER_Y + Math.sin(angleRad) * distance;

            const isIntroduction = branch.portal_type === 'introduction';
            const theme = branch.id === 'introduction-janice'
              ? 'nocturnal'
              : branch.id === 'introduction-paul'
                ? 'celestial'
                : (themeColors[branch.theme] ? branch.theme : 'nocturnal');
            const filamentStyle = branch.filament || 'standard';

            const portalFilamentGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            portalFilamentGroup.setAttribute('class', 'portal-filament-group');
            portalFilamentGroup.setAttribute('data-portal-id', branch.id);
            renderFilament(portalFilamentGroup, x, y, idx, theme, filamentStyle);
            ligamentsGroup.appendChild(portalFilamentGroup);

            const node = isIntroduction
              ? createIntroductionNode(branch, theme, portalFilamentGroup)
              : document.createElement('div');
            if (!isIntroduction) node.className = `portal-node theme-${theme}`;
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;

            const thumbSrc = branch.thumbnail || (branch.grid_thumbs && branch.grid_thumbs[0]) || (branch.photos && branch.photos[0]) || '';

            if (!isIntroduction) node.innerHTML = `
              <div class="portal-ring">
                <img class="portal-thumb" src="${thumbSrc}" alt="${branch.title || branch.id}" decoding="async" />
              </div>
              <div class="portal-label">
                <div class="portal-title">${branch.title || branch.id}</div>
                <div class="portal-subtitle">${branch.subtitle || ''}</div>
              </div>
            `;

            node.addEventListener('click', () => openGallery(branch, node));
            diskPlane.appendChild(node);
          });

          // If multiple slices exist, render the Alchemical Armillary & Slender Astrolabe Conduit
          if (sliceList.length > 1) {
            const nextSliceIdx = (sIdx + 1) % sliceList.length;
            const nextSlice = sliceList[nextSliceIdx];

            const customAngle = sliceObj.items.find(b => b.bridge_angle !== undefined && b.bridge_angle !== null && b.bridge_angle !== '')?.bridge_angle;
            const customDist = sliceObj.items.find(b => b.bridge_distance !== undefined && b.bridge_distance !== null && b.bridge_distance !== '')?.bridge_distance;

            const bridgeAngleDeg = (customAngle !== undefined && !isNaN(parseFloat(customAngle)))
              ? parseFloat(customAngle)
              : chooseBridgeAngle(sliceObj.items);
            const bridgeDist = (customDist !== undefined && !isNaN(parseFloat(customDist)))
              ? parseFloat(customDist)
              : 455;
            const bridgeRad = (bridgeAngleDeg * Math.PI) / 180;
            const bx = CENTER_X + Math.cos(bridgeRad) * bridgeDist;
            const by = CENTER_Y + Math.sin(bridgeRad) * bridgeDist;

            const dx = bx - CENTER_X;
            const dy = by - CENTER_Y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len;
            const uy = dy / len;
            const nx = -uy;
            const ny = ux;

            const c1x = CENTER_X + dx * 0.33 + nx * 10;
            const c1y = CENTER_Y + dy * 0.33 + ny * 10;
            const c2x = CENTER_X + dx * 0.66 - nx * 10;
            const c2y = CENTER_Y + dy * 0.66 - ny * 10;
            const coreAxisD = `M ${CENTER_X} ${CENTER_Y} C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${bx.toFixed(1)} ${by.toFixed(1)}`;

            const midX = (CENTER_X + bx) / 2;
            const midY = (CENTER_Y + by) / 2;
            const arcSpread = 14;
            const arcLeftD = `M ${CENTER_X} ${CENTER_Y} Q ${(midX + nx * arcSpread).toFixed(1)} ${(midY + ny * arcSpread).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
            const arcRightD = `M ${CENTER_X} ${CENTER_Y} Q ${(midX - nx * arcSpread).toFixed(1)} ${(midY - ny * arcSpread).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;

            let ticksD = '';
            const tickSteps = [0.22, 0.28, 0.38, 0.44, 0.50, 0.56, 0.62, 0.72, 0.78, 0.86];
            tickSteps.forEach((t, tIdx) => {
              const tx = CENTER_X + dx * t;
              const ty = CENTER_Y + dy * t;
              const halfTick = (t === 0.50) ? 6.5 : (tIdx % 2 === 0 ? 4.2 : 2.5);
              ticksD += `M ${(tx - nx * halfTick).toFixed(1)} ${(ty - ny * halfTick).toFixed(1)} L ${(tx + nx * halfTick).toFixed(1)} ${(ty + ny * halfTick).toFixed(1)} `;
            });

            const bridgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            bridgeGroup.setAttribute('class', 'bridge-filament-group');

            const hitPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            hitPath.setAttribute('d', coreAxisD);
            hitPath.setAttribute('class', 'bridge-hit-target');
            bridgeGroup.appendChild(hitPath);

            const auraPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            auraPath.setAttribute('d', coreAxisD);
            auraPath.setAttribute('class', 'bridge-outer-aura');
            bridgeGroup.appendChild(auraPath);

            [arcLeftD, arcRightD].forEach((arcD) => {
              const arcPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              arcPath.setAttribute('d', arcD);
              arcPath.setAttribute('class', 'bridge-astrolabe-arc');
              bridgeGroup.appendChild(arcPath);
            });

            const ticksPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            ticksPath.setAttribute('d', ticksD.trim());
            ticksPath.setAttribute('class', 'bridge-astrolabe-ticks');
            bridgeGroup.appendChild(ticksPath);

            const corePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            corePath.setAttribute('d', coreAxisD);
            corePath.setAttribute('class', 'bridge-core-path');
            bridgeGroup.appendChild(corePath);

            const surgePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            surgePath.setAttribute('d', coreAxisD);
            surgePath.setAttribute('class', 'bridge-warp-surge');
            bridgeGroup.appendChild(surgePath);

            [0.33, 0.66].forEach((t, nIdx) => {
              const hx = CENTER_X + dx * t;
              const hy = CENTER_Y + dy * t;
              const nodeCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
              nodeCircle.setAttribute('cx', hx.toFixed(1));
              nodeCircle.setAttribute('cy', hy.toFixed(1));
              nodeCircle.setAttribute('r', nIdx === 1 ? '3.4' : '2.6');
              nodeCircle.setAttribute('class', 'bridge-harmonic-node');
              bridgeGroup.appendChild(nodeCircle);
            });

            bridgeGroup.addEventListener('click', () => switchToSlice(nextSliceIdx));
            ligamentsGroup.appendChild(bridgeGroup);

            const bridgeNode = document.createElement('div');
            bridgeNode.className = 'bridge-node';
            bridgeNode.style.left = `${bx}px`;
            bridgeNode.style.top = `${by}px`;
            bridgeNode.innerHTML = `
              <div class="bridge-sigil-ring">
                <svg class="bridge-sigil-svg" viewBox="0 0 64 64">
                  <!-- Outer Ouroboros Serpent Ring -->
                  <g class="armillary-ouroboros">
                    <path d="M 30 4.2 A 27.8 27.8 0 1 0 34.2 4.2" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
                    <circle cx="32" cy="32" r="27.8" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-dasharray="1 3.5" opacity="0.7" />
                    <polygon points="32,1.8 36,4.2 32,6.6 28.5,4.2" fill="currentColor" stroke="#ffffff" stroke-width="0.4" />
                    <circle cx="33.2" cy="4.2" r="0.65" fill="#050508" />
                  </g>

                  <!-- 3D Interlocking Armillary Meridian Sphere -->
                  <g class="armillary-rings">
                    <circle cx="32" cy="32" r="20.5" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.88" />
                    <ellipse cx="32" cy="32" rx="20.5" ry="7.5" fill="none" stroke="currentColor" stroke-width="1.05" transform="rotate(-28 32 32)" />
                    <ellipse cx="32" cy="32" rx="20.5" ry="7.5" fill="none" stroke="#ffffff" stroke-width="0.55" stroke-dasharray="1.5 2.5" transform="rotate(-28 32 32)" opacity="0.75" />
                    <ellipse cx="32" cy="32" rx="9" ry="20.5" fill="none" stroke="currentColor" stroke-width="0.75" transform="rotate(22 32 32)" opacity="0.7" />
                    <ellipse cx="32" cy="32" rx="20.5" ry="9" fill="none" stroke="currentColor" stroke-width="0.75" transform="rotate(22 32 32)" opacity="0.7" />
                    <line x1="32" y1="8.5" x2="32" y2="55.5" stroke="currentColor" stroke-width="0.65" stroke-dasharray="2 2" opacity="0.65" transform="rotate(22 32 32)" />
                  </g>

                  <!-- Central Vesica Piscis Portal Keyhole -->
                  <g class="armillary-keyhole">
                    <path d="M 32 22.5 Q 38.5 32 32 41.5 Q 25.5 32 32 22.5 Z" fill="rgba(255, 255, 255, 0.14)" stroke="#ffffff" stroke-width="1.15" />
                    <circle cx="32" cy="32" r="2.8" fill="#ffffff" />
                    <circle cx="32" cy="32" r="1.1" fill="#050508" />
                  </g>
                </svg>
              </div>
              <div class="bridge-label">
                <div class="bridge-title">Dimensional Shift</div>
                <div class="bridge-sub">Warp to: ${nextSlice.name}</div>
              </div>
            `;
            bridgeNode.addEventListener('click', () => switchToSlice(nextSliceIdx));
            diskPlane.appendChild(bridgeNode);
          }

          disksContainer.appendChild(diskPlane);
        });

        switchToSlice(0);
      } catch (err) {
        console.error('Error rendering portal network:', err);
      }
    }

    loadPortals();
  </script>

</style>
<script id="personal-portals-extension">
(() => {
  'use strict';
  if (window.__personalPortalsInstalled) return;
  // This extension uses the existing modal and its existing lock/unlock lifecycle.
  if (typeof window.showPortalContent !== 'function' ||
      typeof window.openGallery !== 'function') {
    console.warn('Personal portals: paste this block after the main site script.');
    return;
  }
  window.__personalPortalsInstalled = true;
  const modal = document.getElementById('gallery-modal');
  const panel = document.getElementById('modal-poem-panel');
  if (!modal || !panel) return;
  const originalShow = window.showPortalContent;
  const originalOpen = window.openGallery;
  const text = value => typeof value === 'string' ? value : '';
  const people = {
    'introduction-janice': 'janice',
    'introduction-paul': 'paul'
  };

  // Original ornamental linework: Persephone, foliage and pomegranate;
  // Dionysian ivy/grapes, horned satyr mask and panpipes. No external assets.
  function emblem(person) {
    const foliage = `
      <path d="M12 83C48 89 61 42 115 49M205 49C259 42 272 89 308 83"
        opacity=".6"/>
      <path d="M40 77Q22 59 44 58Q49 67 40 77ZM57 66Q49 43 68 46Q72 58 57 66Z
        M76 55Q74 35 91 38Q95 49 76 55Z
        M280 77Q298 59 276 58Q271 67 280 77ZM263 66Q271 43 252 46Q248 58 263 66Z
        M244 55Q246 35 229 38Q225 49 244 55Z" fill="currentColor" fill-opacity=".16"/>`;
    const persephone = `
      <path d="M139 83Q134 66 139 47Q144 35 158 35Q178 35 183 49
        L189 57L182 60L182 67Q177 72 167 72L166 82M145 46Q151 48 152 57
        M177 53L181 53M178 64L182 64M137 83Q157 92 181 83"/>
      <path d="M139 39L137 28L149 33L156 23L164 32L177 26L177 39
        M145 39Q158 33 174 40"/>
      <path d="M147 29Q136 19 143 17Q153 17 147 29Z
        M166 28Q170 13 178 17Q180 24 166 28Z"/>
      <path d="M90 87C77 76 78 65 90 63L86 57L93 60L100 56L98 64
        C113 71 107 84 97 89Z" fill="currentColor" fill-opacity=".12"/>
      <path d="M86 74L89 77M94 71L97 74M96 80L99 82M88 82L90 84"/>
      <path d="M219 86Q215 65 225 61Q232 68 224 72Q216 76 228 79
        M222 64Q208 53 211 48Q224 49 222 64Z"/>
      <path d="M112 95H208" opacity=".45"/>`;
    const dionysus = `
      <path d="M139 51Q145 35 160 36Q177 35 183 51L180 69Q173 83 160 85
        Q147 82 140 69ZM139 53L130 46L132 64L142 68M182 53L190 46L188 64L179 68"/>
      <path d="M142 43Q128 24 143 22Q149 24 145 33
        M178 43Q192 24 177 22Q171 24 175 33"/>
      <path d="M146 57Q151 53 155 57M166 57Q172 53 176 57
        M160 57L156 68L163 69M150 73Q160 79 171 72M151 79L160 90L169 79"/>
      <path d="M139 42Q159 26 182 43M146 37L143 28L154 32L159 24L165 32
        L176 28L174 37" fill="currentColor" fill-opacity=".14"/>
      <g fill="currentColor" fill-opacity=".3">
        <circle cx="91" cy="67" r="4"/><circle cx="100" cy="67" r="4"/>
        <circle cx="86" cy="75" r="4"/><circle cx="95" cy="75" r="4"/>
        <circle cx="104" cy="75" r="4"/><circle cx="91" cy="83" r="4"/>
        <circle cx="100" cy="83" r="4"/><circle cx="95" cy="90" r="4"/>
      </g>
      <path d="M95 62Q94 48 105 48M95 59L82 53L86 45L99 50L111 47L109 58Z"/>
      <path d="M219 59V87H225V59ZM225 59V83H231V59ZM231 59V79H237V59Z
        M218 65H238M112 97H208" opacity=".65"/>`;
    return `<svg class="profile-emblem" viewBox="0 0 320 110"
      xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <g fill="none" stroke="currentColor" stroke-width="1.25"
        stroke-linecap="round" stroke-linejoin="round">
        ${foliage}${person === 'janice' ? persephone : dionysus}
      </g></svg>`;
  }

  function clearProfile() {
    panel.querySelector('.personal-profile')?.remove();
    modal.classList.remove('has-personal-profile');
    delete modal.dataset.profilePerson;
  }

  function renderProfile(branch) {
    clearProfile();
    const person = people[branch.id];
    if (!person) return;
    modal.classList.add('has-personal-profile');
    modal.dataset.profilePerson = person;
    modal.setAttribute('aria-label', `${person === 'janice' ? 'Janice' : 'Paul'}: poem, archetypes and personal writing`);
    panel.setAttribute('aria-label', 'Poem, archetypes and personal writing');
    const section = document.createElement('section');
    section.className = 'personal-profile';
    section.setAttribute('aria-labelledby', 'personal-archetypes-heading');
    // Only fixed, developer-authored markup is parsed here.
    section.innerHTML = `
      <h3 id="personal-archetypes-heading">Archetypes</h3>
      <dl class="archetype-register"></dl>
      <section class="personal-writing" aria-labelledby="personal-writing-heading">
        ${emblem(person)}
        <h3 id="personal-writing-heading">Personal writing</h3>
        <p class="personal-writing-text"></p>
      </section>`;
    const values = branch.archetypes && typeof branch.archetypes === 'object'
      ? branch.archetypes : {};
    const register = section.querySelector('.archetype-register');
    [['zodiacal', 'Zodiacal'], ['mythological', 'Mythological'], ['animalia', 'Animalia']]
      .forEach(([key, label]) => {
        const row = document.createElement('div');
        const dt = document.createElement('dt');
        const dd = document.createElement('dd');
        dt.textContent = label;
        dd.textContent = text(values[key]).trim() || 'Not yet inscribed';
        dd.classList.toggle('is-empty', !text(values[key]).trim());
        row.append(dt, dd);
        register.append(row);
      });
    const writing = section.querySelector('.personal-writing-text');
    const prose = text(branch.profile_text);
    writing.textContent = prose.trim() ? prose : 'Words will find their home here.';
    writing.classList.toggle('is-empty', !prose.trim());
    panel.append(section);
  }

  window.openGallery = function(branch, ...args) {
    clearProfile();
    panel.setAttribute('aria-label', 'Poem');
    return originalOpen.call(this, branch, ...args);
  };
  window.showPortalContent = function(branch, ...args) {
    const result = originalShow.call(this, branch, ...args);
    // Runs only when the original renderer permits content to be shown.
    if (branch.portal_type === 'introduction') renderProfile(branch);
    return result;
  };
})();
</script>

<button type="button" id="music-motion-toggle" class="music-motion-toggle"
  aria-pressed="false" aria-controls="music-landscape">Pause scene</button>
<script id="music-scene-framing">
(() => {
  'use strict';
  const scene = document.getElementById('music-landscape');
  if (!scene) return;
  const narrow = window.matchMedia('(max-width: 680px)');
  const frame = () => scene.setAttribute('viewBox',
    narrow.matches ? '0 0 800 1200' : '0 0 1600 1000');
  frame();
  narrow.addEventListener('change', frame);
  const button = document.getElementById('music-motion-toggle');
  button.addEventListener('click', () => {
    const paused = document.body.classList.toggle('music-motion-paused');
    button.setAttribute('aria-pressed', String(paused));
    button.textContent = paused ? 'Resume scene' : 'Pause scene';
  });
})();

</script>
